<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>はなす · 말하는 일본어</title>
<!-- Google Analytics (GA4) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2S4N123Q9E"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f6f3ec; --panel:#fffdf8; --panel2:#eeeae1; --line:#e3ddd1; --ink:#1c1a17; --ink2:#67615a; --ink3:#9a948a;
    --accent:#cf412a; --accent-ink:#fff; --accent-soft:rgba(207,65,42,.10);
    --ok:#1d8a4b; --ok-soft:rgba(29,138,75,.12); --mid:#a86400; --bad:#c8372a; --bad-soft:rgba(200,55,42,.11);
    --shadow:0 8px 28px rgba(40,30,20,.09);
    --jp:'Noto Sans JP', sans-serif; --kr:'Noto Sans KR', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#131211; --panel:#1c1b19; --panel2:#282623; --line:#302e2a; --ink:#f3efe8; --ink2:#aaa398; --ink3:#746e66;
      --accent:#ff7a5f; --accent-ink:#1a0c08; --accent-soft:rgba(255,122,95,.13);
      --ok:#5fd38d; --ok-soft:rgba(95,211,141,.14); --mid:#f1b64c; --bad:#ff7d6e; --bad-soft:rgba(255,125,110,.15);
      --shadow:0 8px 28px rgba(0,0,0,.45);
    }
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  [hidden] { display:none !important; }
  html { -webkit-text-size-adjust:100%; }
  body {
    min-height:100vh; min-height:100dvh;
    background:var(--bg); color:var(--ink);
    font-family:var(--kr); line-height:1.6;
    -webkit-tap-highlight-color:transparent;
  }
  body.drilling { overflow:hidden; }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
  button:disabled { cursor:default; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  a { color:var(--accent); }
  .jp { font-family:var(--jp); }
  ruby rt { font-size:.5em; color:var(--ink3); font-weight:400; }
  body.no-furi rt { display:none; }
  body.no-pron .pr { display:none; }

  .wrap { max-width:1080px; margin:0 auto; padding:28px 20px 64px; }

  /* 헤더 */
  header.top { display:flex; flex-wrap:wrap; gap:20px 32px; align-items:flex-end; justify-content:space-between;
    padding-bottom:20px; border-bottom:1px solid var(--line); }
  .brand h1 { font-family:var(--jp); font-size:2.4rem; font-weight:700; line-height:1.1; letter-spacing:.04em; }
  .brand h1 b { color:var(--accent); }
  .brand p { color:var(--ink2); margin-top:6px; }
  .side { display:flex; flex-direction:column; gap:12px; min-width:260px; }
  .overall .label { display:flex; justify-content:space-between; font-size:.85rem; color:var(--ink2); margin-bottom:6px; }
  .overall .label b { color:var(--ink); font-variant-numeric:tabular-nums; }
  .bar { height:6px; border-radius:99px; background:var(--panel2); overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--accent); border-radius:inherit; transition:width .4s ease; }
  .settings { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { border:1px solid var(--line); background:var(--panel); color:var(--ink2); font-size:.82rem;
    padding:5px 12px; border-radius:99px; display:inline-flex; align-items:center; gap:6px; }
  .chip[aria-pressed="true"] { background:var(--ink); border-color:var(--ink); color:var(--bg); }
  .chip select { font:inherit; color:var(--ink); background:transparent; border:0; max-width:130px; cursor:pointer; }
  .chip select option { color:#000; }

  .banner { margin-top:16px; padding:12px 16px; border-radius:12px; background:var(--bad-soft); color:var(--bad); font-size:.9rem; }

  /* 레이아웃 */
  .layout { display:grid; grid-template-columns:250px minmax(0,1fr); gap:32px; margin-top:24px; align-items:start; }
  nav.units { position:sticky; top:16px; display:flex; flex-direction:column; gap:2px; }
  .unit-btn { display:grid; grid-template-columns:26px 1fr auto; align-items:center; gap:10px;
    text-align:left; padding:9px 12px; border-radius:12px; }
  .unit-btn:hover { background:var(--panel2); }
  .unit-btn[aria-current="true"] { background:var(--panel); box-shadow:var(--shadow); }
  .unit-btn .n { font-size:.75rem; font-weight:700; color:var(--ink3); font-variant-numeric:tabular-nums; }
  .unit-btn[aria-current="true"] .n { color:var(--accent); }
  .unit-btn .t { display:flex; flex-direction:column; font-weight:500; font-size:.95rem; line-height:1.35; }
  .unit-btn .s { font-family:var(--jp); font-size:.72rem; color:var(--ink3); font-weight:400; }
  .unit-btn .p { font-size:.75rem; color:var(--ink3); font-variant-numeric:tabular-nums; }
  .unit-btn.done .p { color:var(--ok); font-weight:700; }
  .review-btn { margin-top:10px; padding:10px 12px; border-radius:12px; border:1px dashed var(--line);
    color:var(--ink2); font-size:.88rem; text-align:left; }
  .review-btn:hover { border-color:var(--accent); color:var(--accent); }

  /* 단원 */
  .unit-head { display:flex; flex-wrap:wrap; gap:16px 24px; align-items:flex-end; justify-content:space-between; }
  .eyebrow { font-size:.78rem; font-weight:700; letter-spacing:.1em; color:var(--accent); }
  .unit-head h2 { font-size:1.75rem; line-height:1.3; }
  .goal { color:var(--ink2); }
  .start { display:flex; flex-direction:column; gap:6px; align-items:flex-end; }
  .start-btns { display:flex; gap:8px; flex-wrap:wrap; }
  .start-hint { font-size:.78rem; color:var(--ink3); }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:10px 16px;
    border-radius:12px; border:1px solid var(--line); background:var(--panel); font-weight:500; font-size:.95rem; }
  .btn:hover { border-color:var(--ink3); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn.primary:hover { filter:brightness(1.06); }
  .btn svg { width:18px; height:18px; flex:none; }
  .btn.playing { border-color:var(--accent); color:var(--accent); }

  .note { margin-top:22px; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px 20px; }
  .note summary { cursor:pointer; font-weight:700; font-size:.95rem; }
  .note-body { margin-top:10px; font-size:.93rem; }
  .note-body p { margin-bottom:8px; }
  .note-body ul { padding-left:1.1em; }
  .note-body li { margin:5px 0; }
  .note-body .jp { font-size:1.02em; }
  .note-body table { border-collapse:collapse; margin:10px 0 12px; width:100%; font-size:.9rem; }
  .note-body th, .note-body td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:bottom; }
  .note-body th { color:var(--ink2); font-weight:500; white-space:nowrap; }
  .table-scroll { overflow-x:auto; }

  .phrases { list-style:none; margin-top:18px; display:flex; flex-direction:column; gap:8px; }
  .phrase { display:grid; grid-template-columns:40px minmax(0,1fr) auto 40px; gap:14px; align-items:center;
    padding:12px 14px; background:var(--panel); border:1px solid var(--line); border-radius:14px; }
  .phrase .txt { cursor:pointer; border-radius:8px; }
  .phrase .ja { font-family:var(--jp); font-size:1.22rem; line-height:1.95; }
  .phrase .pr { font-size:.85rem; color:var(--accent); }
  .phrase .ko { font-size:.88rem; color:var(--ink2); }
  .icon-btn { width:40px; height:40px; border-radius:50%; display:grid; place-items:center; background:var(--panel2); color:var(--ink2); flex:none; }
  .icon-btn:hover, .icon-btn.playing { color:var(--accent); }
  .icon-btn svg { width:18px; height:18px; }
  .badge { min-width:44px; text-align:center; font-size:.8rem; font-weight:700; font-variant-numeric:tabular-nums;
    padding:3px 8px; border-radius:99px; background:var(--panel2); color:var(--ink3); }
  .badge.pass { background:var(--ok-soft); color:var(--ok); }
  .badge.fail { background:var(--bad-soft); color:var(--bad); }

  footer { margin-top:48px; padding-top:20px; border-top:1px solid var(--line); font-size:.82rem; color:var(--ink3); }
  footer p + p { margin-top:4px; }

  /* 연습 화면 */
  .drill { position:fixed; inset:0; z-index:10; background:var(--bg); overflow-y:auto; }
  .drill-inner { max-width:640px; min-height:100%; margin:0 auto; display:flex; flex-direction:column; gap:18px;
    padding:max(16px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); }
  .drill-top { display:flex; align-items:center; gap:12px; }
  .drill-top .lab { flex:1; font-size:.92rem; font-weight:500; color:var(--ink2); }
  .drill-top .cnt { font-size:.9rem; color:var(--ink2); font-variant-numeric:tabular-nums; }
  #d-play { display:flex; flex-direction:column; gap:18px; flex:1; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:24px; box-shadow:var(--shadow);
    padding:32px 24px; min-height:210px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px; text-align:center; }
  .big-ko { font-size:clamp(1.3rem, 5vw, 1.75rem); font-weight:700; line-height:1.45; }
  .big-ja { font-family:var(--jp); font-size:clamp(1.6rem, 6.4vw, 2.4rem); font-weight:500; line-height:2; }
  .card .pr { color:var(--accent); }
  .card .ko { color:var(--ink2); }
  .seg.ok { color:var(--ok); }
  .seg.bad { color:var(--bad); background:var(--bad-soft); border-radius:6px; }
  .link { color:var(--ink3); font-size:.88rem; text-decoration:underline; text-underline-offset:3px; }
  .link:hover { color:var(--accent); }
  .audio-row { display:flex; gap:8px; justify-content:center; }
  .mic-area { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .mic { position:relative; width:84px; height:84px; border-radius:50%; display:grid; place-items:center;
    background:var(--accent); color:var(--accent-ink); box-shadow:0 10px 28px var(--accent-soft), 0 4px 10px rgba(0,0,0,.12);
    transition:transform .15s ease; }
  .mic:active { transform:scale(.95); }
  .mic svg { width:32px; height:32px; }
  .mic.on::before, .mic.on::after { content:''; position:absolute; inset:-6px; border-radius:50%;
    border:2px solid var(--accent); animation:pulse 1.6s ease-out infinite; }
  .mic.on::after { animation-delay:.8s; }
  .mic:disabled { background:var(--panel2); color:var(--ink3); box-shadow:none; }
  @keyframes pulse { from { transform:scale(.92); opacity:.85; } to { transform:scale(1.4); opacity:0; } }
  .mic-cap { font-size:.84rem; color:var(--ink3); text-align:center; }
  .heard { min-height:1.7em; text-align:center; font-family:var(--jp); color:var(--ink2); }
  .heard .lab { font-family:var(--kr); font-size:.76rem; color:var(--ink3); margin-right:8px; }
  .heard.err { font-family:var(--kr); color:var(--bad); font-size:.9rem; }
  .result { display:flex; align-items:center; justify-content:center; gap:14px; }
  .ring { width:72px; height:72px; flex:none; }
  .ring circle { fill:none; stroke-width:6; }
  .ring .track { stroke:var(--panel2); }
  .ring .val { stroke-linecap:round; transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1); }
  .ring text { font:700 19px var(--kr); fill:var(--ink); }
  .verdict b { display:block; font-size:1.15rem; }
  .verdict small { color:var(--ink3); font-size:.84rem; }
  .drill-foot { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:auto; padding-top:4px; }
  .keys { text-align:center; font-size:.75rem; color:var(--ink3); }
  .keys kbd { font-family:inherit; border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:0 5px; }

  .sum-head { text-align:center; padding:24px 0 8px; }
  .sum-big { font-size:3rem; font-weight:700; line-height:1.1; font-variant-numeric:tabular-nums; }
  .sum-big span { font-size:1.2rem; color:var(--ink3); font-weight:500; margin-left:4px; }
  .sum-head p { color:var(--ink2); }
  .sum-list { list-style:none; display:flex; flex-direction:column; gap:6px; margin:12px 0 20px; }
  .sum-list li { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 14px;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; }
  .sum-list .jp { font-size:1.02rem; }

  .toast { position:fixed; left:50%; bottom:max(24px, env(safe-area-inset-bottom)); transform:translateX(-50%);
    z-index:20; background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:12px; font-size:.9rem;
    box-shadow:var(--shadow); max-width:calc(100% - 32px); }

  /* 프리토킹 */
  .unit-btn.talk .n { color:var(--accent); display:grid; }
  .unit-btn.talk .n svg { width:18px; height:18px; }
  .keybox { margin-top:18px; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px 18px; }
  .keybox form { display:flex; gap:8px; margin:10px 0 8px; }
  .keybox input, .typebox input { flex:1; min-width:0; font:inherit; font-size:16px; padding:10px 12px; border-radius:10px;
    border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  .fine { font-size:.8rem; color:var(--ink3); }
  .talk-bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:18px; }
  .field { display:inline-flex; align-items:center; gap:6px; font-size:.82rem; color:var(--ink2); border:1px solid var(--line);
    background:var(--panel); border-radius:10px; padding:5px 10px; }
  .field select { font:inherit; color:var(--ink); background:transparent; border:0; cursor:pointer; max-width:150px; }
  .field select option { color:#000; }
  .chat { display:flex; flex-direction:column; gap:14px; margin-top:20px; min-height:200px; }
  .empty { text-align:center; color:var(--ink2); padding:36px 16px; border:1px dashed var(--line); border-radius:16px;
    display:flex; flex-direction:column; align-items:center; gap:14px; }
  .msg { max-width:min(580px, 92%); display:flex; flex-direction:column; }
  .msg.ai { align-self:flex-start; }
  .msg.me { align-self:flex-end; align-items:flex-end; }
  .msg.sys { align-self:center; }
  .who { font-size:.74rem; color:var(--ink3); margin:0 6px 4px; }
  .bubble { padding:12px 16px; border-radius:18px; border:1px solid var(--line); background:var(--panel); }
  .msg.ai .bubble { border-top-left-radius:6px; }
  .msg.me .bubble { background:var(--accent-soft); border-color:transparent; border-top-right-radius:6px; font-size:1.05rem; }
  .msg.me .bubble[lang="ja"] { font-family:var(--jp); }
  .bubble .ja, .fb .ja { font-family:var(--jp); font-size:1.2rem; line-height:1.9; }
  .bubble .pr, .fb .pr { color:var(--accent); font-size:.85rem; }
  .bubble .ko { color:var(--ink2); font-size:.88rem; margin-top:2px; }
  body.no-trans .chat .ko { display:none; }
  .bubble.err { background:var(--bad-soft); border-color:transparent; color:var(--bad); font-size:.9rem; }
  .bubble.err .link { color:inherit; margin-left:6px; }
  .acts { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:8px; }
  .icon-btn.sm { width:34px; height:34px; }
  .icon-btn.sm svg { width:15px; height:15px; }
  .btn.sm { padding:6px 12px; font-size:.84rem; border-radius:10px; }
  .btn.sm svg { width:15px; height:15px; }
  .btn.on { border-color:var(--accent); color:var(--accent); }
  .fb { margin-top:8px; width:100%; text-align:left; border-radius:14px; padding:10px 14px; font-size:.88rem; border:1px solid var(--line); background:var(--panel); }
  .fb.good { background:var(--ok-soft); color:var(--ok); border-color:transparent; }
  .fb-word { display:block; width:100%; text-align:left; padding:3px 0; color:var(--ink); line-height:1.9; }
  .fb-word .jp { font-size:1.08rem; }
  .fb-word .pr { margin-left:2px; }
  .fb-word:hover .jp { color:var(--accent); }
  .fb-say { margin-top:4px; color:var(--ink); }
  .fb-say .ja { font-size:1.15rem; }
  .fb .fb-note { color:var(--ink2); margin-top:4px; }
  .fb .heard { font-size:.8rem; color:var(--ink3); margin-top:4px; }
  .sugs { display:flex; flex-direction:column; gap:6px; margin-top:10px; }
  .sugs-lab { font-size:.74rem; color:var(--ink3); margin-left:6px; }
  .sug { text-align:left; border:1px dashed var(--line); border-radius:12px; padding:7px 12px; display:flex; flex-direction:column; }
  .sug:hover { border-color:var(--accent); }
  .sug .ja { font-family:var(--jp); font-size:1rem; line-height:1.8; }
  .sug .ko { color:var(--ink3); font-size:.78rem; }
  .sug .pr { color:var(--accent); font-size:.8rem; }
  .typing { display:flex; gap:5px; padding:16px 18px; }
  .typing span { width:7px; height:7px; border-radius:50%; background:var(--ink3); animation:blink 1.2s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay:.15s; } .typing span:nth-child(3) { animation-delay:.3s; }
  @keyframes blink { 0%, 80%, 100% { opacity:.25; } 40% { opacity:1; } }
  .composer { position:sticky; bottom:0; z-index:2; margin-top:8px; padding:18px 0 max(14px, env(safe-area-inset-bottom));
    background:linear-gradient(to bottom, transparent, var(--bg) 26%); display:flex; flex-direction:column; align-items:center; gap:8px; }
  .comp-row { display:flex; align-items:center; gap:18px; }
  .mic.talk { width:72px; height:72px; }
  .mic.talk svg { width:28px; height:28px; }
  .side-btn { display:flex; flex-direction:column; align-items:center; gap:3px; font-size:.74rem; color:var(--ink2); width:62px; }
  .side-btn .icon-btn { width:44px; height:44px; }
  .side-btn.on .icon-btn { background:var(--accent); color:var(--accent-ink); }
  .side-btn:disabled { opacity:.4; }
  .live { min-height:1.5em; max-width:560px; font-family:var(--jp); color:var(--ink2); text-align:center; font-size:.95rem; }
  .live.err { font-family:var(--kr); color:var(--bad); font-size:.85rem; }
  .typebox { display:flex; gap:8px; width:100%; max-width:560px; }
  details.keybox summary { cursor:pointer; }
  details.keybox[open] summary { margin-bottom:6px; }
  details.keybox p { margin:6px 0; }
  .cmd { margin:8px 0; padding:10px 12px; border-radius:10px; background:var(--panel2); font-size:.8rem; overflow-x:auto; white-space:pre; }
  code { font-size:.9em; background:var(--panel2); padding:1px 5px; border-radius:5px; }
  #ollama-status { white-space:nowrap; }

  @media (max-width: 760px) {
    .wrap { padding:20px 16px 48px; }
    .brand h1 { font-size:2rem; }
    .side { min-width:0; width:100%; }
    .layout { grid-template-columns:minmax(0,1fr); gap:16px; }
    nav.units { position:static; flex-direction:row; overflow-x:auto; margin:0 -16px; padding:4px 16px 8px;
      scroll-snap-type:x proximity; scrollbar-width:none; }
    nav.units::-webkit-scrollbar { display:none; }
    .unit-btn { flex:0 0 auto; grid-template-columns:auto auto; gap:6px; scroll-snap-align:start;
      border:1px solid var(--line); background:var(--panel); padding:8px 12px; }
    .unit-btn .s, .unit-btn .p { display:none; }
    .review-btn { flex:0 0 auto; margin-top:0; }
    .start { align-items:stretch; width:100%; }
    .start-btns .btn { flex:1; }
    .phrase { grid-template-columns:36px minmax(0,1fr) auto; gap:10px; padding:10px 12px; }
    .phrase .mic-sm { display:none; }
    .icon-btn { width:36px; height:36px; }
    .drill-inner, #d-play { gap:14px; }
    .card { padding:24px 16px; min-height:180px; }
    .keys { display:none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .mic.on::before, .mic.on::after, .typing span { animation:none; opacity:.6; }
    .bar i, .ring .val { transition:none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>はなす<b>。</b></h1>
      <p>듣고, 따라 말하고, 바로 채점받는 일본어 속성 코스</p>
    </div>
    <div class="side">
      <div class="overall">
        <div class="label"><span>통과한 문장 (80점 이상)</span><b id="overall-num"></b></div>
        <div class="bar"><i id="overall-bar"></i></div>
      </div>

const PASS = 80;

// ---------- 표기 파싱 ----------
const KANJI = '\\u3400-\\u4DBF\\u4E00-\\u9FFF\\uF900-\\uFAFF々〆ヶ';
const TOKEN = new RegExp(`([${KANJI}]+)\\[([^\\]]+)\\]|\\^([はへ])|( )|([^])`, 'gu');

function parse(src) {
  const segs = [];
  for (const m of src.matchAll(TOKEN)) {
    if (m[1]) segs.push({ base: m[1], read: m[2] });
    else if (m[3]) segs.push({ base: m[3], read: m[3] === 'は' ? 'わ' : 'え', particle: true });
    else if (m[4]) segs.push({ space: true });
    else segs.push({ base: m[5] });
  }
  return segs;
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function rubyHTML(segs, status) {
  return segs.map((s, i) => {
    if (s.space) return '';
    const inner = s.read && !s.particle ? `<ruby>${esc(s.base)}<rt>${esc(s.read)}</rt></ruby>` : esc(s.base);
    const st = status && status[i];
    return st ? `<span class="seg ${st}">${inner}</span>` : inner;
  }).join('');
}

const hira = c => {
  const x = c.codePointAt(0);
  return x >= 0x30A1 && x <= 0x30F6 ? String.fromCodePoint(x - 0x60) : c;
};

// ---------- 한글 발음 ----------
const H = {}, H2 = {};
(() => {
  const one = [...'あ아い이う우え에お오か카き키く쿠け케こ코が가ぎ기ぐ구げ게ご고さ사し시す스せ세そ소ざ자じ지ず즈ぜ제ぞ조' +
    'た타ち치つ츠て테と토だ다ぢ지づ즈で데ど도な나に니ぬ누ね네の노は하ひ히ふ후へ헤ほ호ば바び비ぶ부べ베ぼ보' +
    'ぱ파ぴ피ぷ푸ぺ페ぽ포ま마み미む무め메も모や야ゆ유よ요ら라り리る루れ레ろ로わ와を오ゔ부' +
    'ぁ아ぃ이ぅ우ぇ에ぉ오ゃ야ゅ유ょ요ゎ와'];
  for (let i = 0; i < one.length; i += 2) H[one[i]] = one[i + 1];
  const two = [...'きゃ캬きゅ큐きょ쿄ぎゃ갸ぎゅ규ぎょ교しゃ샤しゅ슈しょ쇼じゃ자じゅ주じょ조ちゃ차ちゅ추ちょ초' +
    'にゃ냐にゅ뉴にょ뇨ひゃ햐ひゅ휴ひょ효びゃ뱌びゅ뷰びょ뵤ぴゃ퍄ぴゅ퓨ぴょ표みゃ먀みゅ뮤みょ묘りゃ랴りゅ류りょ료' +
    'ふぁ화ふぃ피ふぇ페ふぉ포てぃ티でぃ디とぅ투どぅ두うぃ위うぇ웨うぉ워ちぇ체しぇ셰じぇ제つぁ차ゔぁ바'];
  for (let i = 0; i < two.length; i += 3) H2[two[i] + two[i + 1]] = two[i + 2];
})();

const SYL0 = 0xAC00;
const lastSyl = s => { const x = s.charCodeAt(s.length - 1) - SYL0; return x >= 0 && x < 11172 ? x : -1; };
// 받침 없는 마지막 음절에 받침(ㄴ=4, ㅅ=19)을 붙인다
const addFinal = (s, t) => { const x = lastSyl(s); return x >= 0 && x % 28 === 0 ? s.slice(0, -1) + String.fromCharCode(SYL0 + x + t) : s; };
const vowelOf = s => { const x = lastSyl(s); return x >= 0 && x % 28 === 0 ? Math.floor(x / 28) % 21 : -1; };
const V_OU = [8, 12, 13, 17, 18], V_E = [5, 7]; // ㅗㅛㅜㅠㅡ / ㅔㅖ
const PUNCT = { '、': ', ', '。': ' ', '？': '? ', '！': '! ', '?': '? ', '!': '! ' };

function toHangul(segs) {
  const units = [];
  for (const s of segs) {
    if (s.space) { units.push(null); continue; }
    const ruby = !!s.read && !s.particle;
    for (const c of s.read || s.base) units.push({ c: hira(c), ruby, kata: c !== hira(c) || c === 'ー' });
  }
  let out = '', prev = null;
  for (let i = 0; i < units.length; i++) {
    const u = units[i];
    if (!u) { out += ' '; prev = null; continue; }
    const nx = units[i + 1];
    if (nx && H2[u.c + nx.c]) { out += H2[u.c + nx.c]; prev = nx; i++; continue; }
    if (PUNCT[u.c]) { out += PUNCT[u.c]; prev = null; continue; }
    if (u.c === 'っ') out = addFinal(out, 19);
    else if (u.c === 'ん') out = addFinal(out, 4);
    else if (u.c === 'ー') out += '-';
    // 장음: おう·うう는 길게, えい는 한자 읽기 안에서만 길게 (している의 てい는 제외)
    else if (u.c === 'う' && prev && !prev.kata && !u.kata && prev.ruby === u.ruby && V_OU.includes(vowelOf(out))) out += '-';
    else if (u.c === 'い' && prev && prev.ruby && u.ruby && V_E.includes(vowelOf(out))) out += '-';
    else out += H[u.c] || u.c;
    prev = u;
  }
  return out.replace(/\s+/g, ' ').trim();
}

// ---------- 채점 ----------
// ASR은 같은 말을 한자/가나/숫자로 제각각 적으므로 양쪽을 같은 모양으로 맞춘 뒤 비교한다
const VARIANTS = [
  ['下さい', 'ください'], ['有難う', 'ありがとう'], ['御座います', 'ございます'], ['宜しく', 'よろしく'],
  ['頂きます', 'いただきます'], ['ご馳走様', 'ごちそうさま'], ['ご馳走さま', 'ごちそうさま'], ['お休みなさい', 'おやすみなさい'],
  ['お勧め', 'おすすめ'], ['お薦め', 'おすすめ'], ['真っ直ぐ', 'まっすぐ'], ['真っすぐ', 'まっすぐ'],
  ['出来', 'でき'], ['分り', 'わかり'], ['無くし', 'なくし'], ['失くし', 'なくし'], ['綺麗', 'きれい'],
];
const KANJI_NUM = '〇一二三四五六七八九';

function norm(s) {
  s = s.normalize('NFKC').toLowerCase();
  for (const [a, b] of VARIANTS) s = s.split(a).join(b);
  return [...s].map(c => {
    const n = KANJI_NUM.indexOf(c);
    return n >= 0 ? String(n) : hira(c);
  }).join('').replace(/[^\p{L}\p{N}ー]/gu, '');
}

// 문장을 "한자 표기 또는 읽기" 중 아무 길로나 지나갈 수 있는 그래프로 만든다
function buildGraph(segs) {
  const edges = [];
  let cur = 0, n = 1, minLen = 0;
  segs.forEach((s, seg) => {
    if (s.space) return;
    const opts = [...new Set([s.base, s.read].filter(Boolean).map(norm))].filter(Boolean);
    if (!opts.length) return;
    minLen += Math.min(...opts.map(o => [...o].length));
    const tails = [];
    for (const o of opts) {
      const chars = [...o];
      let u = cur;
      chars.forEach((ch, i) => {
        if (i === chars.length - 1) tails.push({ u, ch, seg });
        else { edges.push({ u, v: n, ch, seg }); u = n++; }
      });
    }
    tails.forEach(t => edges.push({ ...t, v: n }));
    cur = n++;
  });
  const inc = Array.from({ length: n }, () => []);
  edges.forEach(e => inc[e.v].push(e));
  return { inc, n, final: cur, minLen, nsegs: segs.length };
}

// 그래프 위 편집 거리. 어느 덩어리를 틀렸는지 역추적해서 돌려준다
function align(g, heard) {
  const a = [...heard], m = a.length;
  const D = [], B = [];
  for (let i = 0; i <= m; i++) {
    D.push(new Float64Array(g.n).fill(Infinity));
    B.push(new Array(g.n).fill(null));
    for (let v = 0; v < g.n; v++) {
      if (i === 0 && v === 0) { D[0][0] = 0; continue; }
      let best = Infinity, bp = null;
      for (const e of g.inc[v]) {
        if (i > 0) {
          const hit = a[i - 1] === e.ch, c = D[i - 1][e.u] + (hit ? 0 : 1);
          if (c < best) { best = c; bp = { i: i - 1, v: e.u, op: hit ? 'ok' : 'sub', e }; }
        }
        if (D[i][e.u] + 1 < best) { best = D[i][e.u] + 1; bp = { i, v: e.u, op: 'del', e }; }
      }
      if (i > 0 && D[i - 1][v] + 1 < best) { best = D[i - 1][v] + 1; bp = { i: i - 1, v, op: 'ins' }; }
      D[i][v] = best; B[i][v] = bp;
    }
  }
  const status = new Array(g.nsegs).fill(null);
  for (let i = m, v = g.final, bp; (bp = B[i][v]); i = bp.i, v = bp.v) {
    if (bp.e) status[bp.e.seg] = status[bp.e.seg] === 'bad' || bp.op !== 'ok' ? 'bad' : 'ok';
  }
  const score = Math.max(0, 1 - D[m][g.final] / Math.max(g.minLen, m, 1));
  return { score, status };
}

function grade(p, transcripts) {
  let best = { score: -1 };
  for (const t of transcripts) {
    const h = norm(t), main = align(p.graph, h);
    if (main.score > best.score) best = { score: main.score, status: main.status, heard: t };
    for (const g of p.altGraphs) {
      const r = align(g, h);
      if (r.score > best.score) {
        best = { score: r.score, heard: t, status: r.score * 100 >= PASS ? main.status.map(s => s && 'ok') : main.status };
      }
    }
  }
  return best;
}

// { j: 표기, alt?: [...] } → 화면·발음·채점에 필요한 것을 채운다
function prep(p) {
  p.segs = parse(p.j);
  p.text = p.segs.map(s => (s.space ? '' : s.base)).join('');
  p.pron = toHangul(p.segs);
  p.graph = buildGraph(p.segs);
  p.altGraphs = (p.alt || []).map(a => buildGraph(parse(a)));
  return p;
}

const store = (() => {
  const KEY = 'hanasu.v1';
  let data = {};
  try { data = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
  data.best = data.best || {};
  data.prefs = { furi: true, pron: true, unit: 0, ...data.prefs };
  return { data, save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} } };
})();
const prefs = store.data.prefs;
const best = p => store.data.best[p.id];
const passed = p => (best(p) ?? -1) >= PASS;
const badge = b => (b == null ? '<span class="badge">–</span>' : `<span class="badge ${b >= PASS ? 'pass' : 'fail'}">${b}</span>`);
const pad = n => String(n).padStart(2, '0');

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
}

// ----- TTS -----
let voices = [];
function pickVoice() {
  return voices.find(v => v.name === prefs.voice)
    || voices.find(v => /google|kyoko|o-ren|nanami|haruka/i.test(v.name))
    || voices[0];
}
function loadVoices() {
  voices = speechSynthesis.getVoices().filter(v => /^ja/i.test(v.lang));
  const sel = $('#voice');
  sel.innerHTML = voices.length
    ? voices.map(v => `<option>${esc(v.name)}</option>`).join('')
    : '<option>일본어 음성 없음</option>';
  sel.disabled = !voices.length;
  const v = pickVoice();
  if (v) sel.value = v.name;
}
function speak(text, { slow = false, btn = null, onend = null } = {}) {
  if (!('speechSynthesis' in window)) return toast('이 브라우저는 음성 재생을 지원하지 않아요.');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  u.rate = slow ? 0.6 : 0.95;
  const v = pickVoice();
  if (v) u.voice = v;
  btn?.classList.add('playing');
  // 끝까지 읽었을 때만 onend (취소·오류로 끊긴 경우는 제외)
  u.onend = () => { btn?.classList.remove('playing'); onend?.(); };
  u.onerror = () => btn?.classList.remove('playing');
  speechSynthesis.speak(u);
}

// ----- ASR -----
// Brave는 API만 노출하고 Google 음성 서버를 막아 두어 항상 'network' 오류가 난다
const IS_BRAVE = !!navigator.brave;
const SR = IS_BRAVE ? null : window.SpeechRecognition || window.webkitSpeechRecognition;
const SR_ERR = {
  'not-allowed': '마이크 권한이 막혀 있어요. 주소창 옆 자물쇠 아이콘에서 마이크를 허용해 주세요.',
  'service-not-allowed': '음성 인식 서비스를 쓸 수 없어요. Safari라면 설정 › Siri에서 받아쓰기를 켜 주세요.',
  'no-speech': '말소리가 들리지 않았어요. 마이크를 누르고 바로 말해 보세요.',
  'audio-capture': '마이크를 찾지 못했어요.',
  'network': '음성 인식 서버에 연결하지 못했어요. 이 브라우저가 음성 인식을 막고 있을 수 있어요. Safari나 Chrome으로 열어 보세요.',
  'language-not-supported': '이 브라우저는 일본어 음성 인식을 지원하지 않아요.',
};
let rec = null;
function listen({ lang = 'ja-JP', onInterim, onDone }) {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  const r = new SR();
  r.lang = lang;
  r.interimResults = true;
  r.maxAlternatives = 5;
  r.continuous = false;
  let finals = null, latest = '', error = null;
  r.onresult = e => {
    const res = Array.from(e.results);
    latest = res.map(x => x[0].transcript).join('');
    onInterim(latest);
    if (res.every(x => x.isFinal)) finals = res.length === 1 ? Array.from(res[0], a => a.transcript) : [latest];
  };
  r.onerror = e => { error = e.error; };
  // Safari는 final 없이 끝나기도 해서 마지막 중간 결과라도 채점한다
  r.onend = () => {
    if (rec === r) rec = null;
    onDone({ transcripts: (finals || (latest ? [latest] : [])).filter(t => t.trim()), error });
  };
  try { r.start(); rec = r; } catch (e) { onDone({ transcripts: [], error: 'start' }); }
}

// ----- 연습 -----
const drill = { items: [], i: 0, mode: 'shadow', title: '', unit: null, results: [], state: 'idle', hinted: false, token: 0 };
const item = () => drill.items[drill.i];
const answerShown = () => drill.mode === 'shadow' || drill.state === 'graded';

function openDrill({ items, mode, title, unit = null }) {
  Object.assign(drill, { items, mode, title, unit, i: 0, results: items.map(() => null) });
  drill.token++;
  $('#drill').hidden = false;
  $('#drill').scrollTop = 0;
  document.body.classList.add('drilling');
  renderCard();
}

function closeDrill() {
  drill.token++;
  rec?.abort();
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  $('#drill').hidden = true;
  document.body.classList.remove('drilling');
  renderNav();
  renderMain();
}

function paintAnswer(status) {
  const p = item(), show = answerShown();
  $('#d-ko').hidden = drill.mode !== 'speak';
  $('#d-ko').textContent = p.k;
  $('#d-ja').hidden = !show;
  $('#d-ja').innerHTML = show ? rubyHTML(p.segs, status) : '';
  $('#d-pr').hidden = !((show && prefs.pron) || drill.hinted);
  $('#d-pr').textContent = p.pron;
  $('#d-sub').hidden = drill.mode === 'speak';
  $('#d-sub').textContent = p.k;
  $('#d-hint').hidden = show || drill.hinted;
  $('#d-audio').hidden = !show && !drill.hinted;
}

function setMic(on) {
  const m = $('#d-mic');
  m.classList.toggle('on', on);
  m.innerHTML = on ? ICON.stop : ICON.mic;
  m.disabled = !SR;
  m.setAttribute('aria-label', on ? '그만 듣기' : '말하기');
  $('#d-cap').textContent = !SR ? '이 브라우저에선 음성 인식을 쓸 수 없어요'
    : on ? '듣고 있어요. 말이 끝나면 자동으로 채점해요'
    : drill.state === 'graded' ? '다시 말하려면 누르세요' : '누르고 일본어로 말해 보세요';
}

function setNext(graded) {
  const last = drill.i === drill.items.length - 1, b = $('#d-next');
  b.textContent = graded ? (last ? '결과 보기' : '다음 →') : (last ? '건너뛰고 결과 보기' : '건너뛰기');
  b.classList.toggle('primary', graded);
}

function renderCard() {
  drill.state = 'idle';
  drill.hinted = false;
  $('#d-label').textContent = drill.title;
  $('#d-count').textContent = `${drill.i + 1} / ${drill.items.length}`;
  $('#d-bar').style.width = `${(drill.i / drill.items.length) * 100}%`;
  $('#d-play').hidden = false;
  $('#d-summary').hidden = true;
  $('#d-heard').className = 'heard';
  $('#d-heard').textContent = '';
  $('#d-result').hidden = true;
  paintAnswer(null);
  setMic(false);
  setNext(false);
  if (drill.mode === 'shadow') speak(item().text, { btn: $('#d-listen') });
}

function onMic() {
  if (!SR) return;
  if (drill.state === 'listening') { rec?.stop(); return; }
  const p = item(), prevState = drill.state, token = ++drill.token, heard = $('#d-heard');
  drill.state = 'listening';
  setMic(true);
  heard.className = 'heard';
  heard.textContent = '';
  listen({
    onInterim: t => { if (token === drill.token) heard.textContent = t; },
    onDone: ({ transcripts, error }) => {
      if (token !== drill.token) return;
      if (!transcripts.length) {
        drill.state = prevState;
        setMic(false);
        heard.className = 'heard err';
        heard.textContent = SR_ERR[error] || SR_ERR['no-speech'];
        return;
      }
      showGrade(p, grade(p, transcripts));
    },
  });
}

const VERDICT = [
  [90, '완벽해요!', '원어민도 알아듣는 발음이에요'],
  [PASS, '통과!', '좋아요, 다음 문장으로 가요'],
  [60, '거의 다 왔어요', '빨간 부분을 다시 듣고 말해 보세요'],
  [0, '다시 한 번!', '듣기를 누르고 천천히 따라 해 보세요'],
];

function showGrade(p, r) {
  const score = Math.round(r.score * 100);
  drill.state = 'graded';
  setMic(false);
  drill.results[drill.i] = Math.max(drill.results[drill.i] ?? 0, score);
  if (score > (best(p) ?? -1)) { store.data.best[p.id] = score; store.save(); }
  paintAnswer(r.status);
  $('#d-heard').className = 'heard';
  $('#d-heard').innerHTML = `<span class="lab">들은 말</span>${esc(r.heard)}`;
  const C = 2 * Math.PI * 30, ring = $('#ring-val');
  ring.style.stroke = score >= PASS ? 'var(--ok)' : score >= 60 ? 'var(--mid)' : 'var(--bad)';
  ring.style.strokeDasharray = C;
  ring.style.strokeDashoffset = C;
  $('#ring-num').textContent = score;
  const [, title, sub] = VERDICT.find(([min]) => score >= min);
  $('#d-verdict').innerHTML = `<b>${title}</b><small>${sub}</small>`;
  $('#d-result').hidden = false;
  requestAnimationFrame(() => requestAnimationFrame(() => { ring.style.strokeDashoffset = C * (1 - score / 100); }));
  setNext(true);
}

function next() {
  if (drill.state === 'listening') { drill.token++; rec?.abort(); }
  if (drill.i < drill.items.length - 1) { drill.i++; renderCard(); } else showSummary();
}

function showSummary() {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  const res = drill.results, tried = res.filter(x => x != null);
  const avg = tried.length ? Math.round(tried.reduce((a, b) => a + b, 0) / tried.length) : 0;
  const pass = tried.filter(x => x >= PASS).length;
  drill.weak = drill.items.filter((_, i) => (res[i] ?? -1) < PASS);
  const hasNext = drill.unit != null && drill.unit < UNITS.length - 1;
  $('#d-bar').style.width = '100%';
  $('#d-count').textContent = `${drill.items.length} / ${drill.items.length}`;
  $('#d-play').hidden = true;
  const s = $('#d-summary');
  s.hidden = false;
  s.innerHTML = `
    <div class="sum-head">
      <div class="sum-big">${pass}<span>/ ${drill.items.length}</span></div>
      <p>통과 · 평균 ${avg}점${tried.length < drill.items.length ? ` · ${drill.items.length - tried.length}문장 건너뜀` : ''}</p>
    </div>
    <ol class="sum-list">${drill.items.map((p, i) => `<li><span class="jp" lang="ja">${esc(p.text)}</span>${badge(res[i])}</li>`).join('')}</ol>
    <div class="drill-foot">
      ${drill.weak.length ? `<button class="btn primary" data-sum="weak">통과 못 한 ${drill.weak.length}문장 다시</button>` : ''}
      ${hasNext ? `<button class="btn${drill.weak.length ? '' : ' primary'}" data-sum="next">다음 단원 →</button>` : ''}
      <button class="btn" data-sum="close">닫기</button>
    </div>`;
}

function startReview() {
  const tried = ALL.filter(p => best(p) != null).sort((a, b) => best(a) - best(b)).slice(0, 10);
  if (!tried.length) return toast('아직 연습한 문장이 없어요. 단원부터 시작해 보세요.');
  for (let i = tried.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [tried[i], tried[j]] = [tried[j], tried[i]];
  }
  openDrill({ items: tried, mode: 'shadow', title: '약한 문장 복습' });
}

// 대화마다 바뀌는 장면·난이도는 첫 메시지로 보내고 system은 고정해 캐시가 맞게 한다
const TALK_SYSTEM = `You are ゆき, a friendly Japanese conversation partner inside "はなす", a speaking-practice page for Korean adults who just finished a short Japanese crash course. The learner talks to you by voice and their speech is transcribed by the browser's speech recognizer. Your job is to keep a natural, encouraging conversation going in very simple Japanese so the learner gets as many chances to speak as possible, and to give short, useful feedback on each thing they say.

How to talk
- Polite です/ます style only. Use JLPT N5-level words and the grammar the learner has studied (listed at the end). At level 입문, stay within the unit 1–4 patterns; at level 초급 you may use every unit.
- Keep "reply" to one or two short sentences and end it with one easy question or prompt the learner can answer with patterns they know. Never ask two questions at once.
- Stay in the scenario given in the first message; if you play a role (staff, passer-by), stay in it.
- React to what the learner actually said before moving on, the way a friend would.

What the learner's turn looks like
- Learners often mix Korean and Japanese: when they don't know a Japanese word they say it in Korean (for example 「わたしは 어제 ともだちと 영화を みました」). That is expected and good; never scold it.
- Turns from the Japanese recognizer may show Korean words as odd kana or katakana that make no sense in Japanese; treat those as the Korean words they sound like.
- Turns from the Korean recognizer ("mixed" button) show Korean words normally and Japanese parts as Hangul phonetic spelling: 와타시와 = 私は, 데스 = です, 마시타 = ました, 토 = と, 오 = を. Reconstruct what they meant from both.
- Speech recognition also makes ordinary mistakes: ignore kanji-versus-kana choices, missing punctuation and spacing, and sound-alike words that don't fit. Judge only grammar, particles, conjugation, word choice and naturalness.

Feedback on the learner's last utterance ("feedback")
- "note_ko" is written in casual, warm Korean 반말, like a friendly tutor-friend (…야, …해, …겠지?), one or two short sentences. The page itself prints the "일본어로 '…'는 …야." lines from "words" and the "「…」라고 말했으면 더 좋았겠지?" line from "corrected", so don't repeat those in "note_ko"; use it only for an extra tip (why a particle or conjugation changes), or leave it empty.
- "none": no learner utterance yet (the opening turn). "words", "corrected" and "note_ko" are empty.
- "good": all Japanese, understandable and natural. "words" and "corrected" are empty; "note_ko" is short, specific praise, or empty.
- "fix": all Japanese, but something is wrong or unnatural. "words" is empty; "corrected" is the most natural way to say what they meant, staying as close to their words as possible; "note_ko" says what changed and why.
- "mixed": part Korean, part Japanese. "words" lists each Korean word or phrase they used with its Japanese ("ko" is the Korean exactly as they meant it, without particles; "ja" is the Japanese word in markup, in the form that fits this sentence). "corrected" is the whole sentence in natural Japanese, keeping their Japanese parts where they were right. "reply" responds to what they meant and keeps the conversation going.
- "translate": entirely Korean (they didn't know how to start). "words" holds the key words; "corrected" is one simple Japanese sentence for what they meant; "reply" only invites them to try saying it (for example 言[い]って みて ください。) without moving the conversation on, and "suggestions" is empty.
- If you can't understand the utterance at all, use "fix" with your best guess, or ask again in "reply".
- Example: the Korean recognizer gives 「와타시와 어제 토모다치토 영화오 미마시타」 → status "mixed", words [{"ko":"어제","ja":"昨日[きのう]"},{"ko":"영화","ja":"映画[えいが]"}], corrected "私[わたし]^は 昨日[きのう] 友達[ともだち]と 映画[えいが]を 見[み]ました。", note_ko "", and reply asks something about the movie.

"reply_ko" is a natural Korean translation of "reply". "suggestions" holds two or three short, different answers the learner could say back to your reply (for example one agreeing, one declining or offering an alternative, one adding a detail) — answers in the learner's voice, never a repeat of your own question — each using patterns they know, with "ko" giving the Korean meaning.

Japanese markup for "reply", "corrected", every "words" "ja" and every suggestion "ja"
- Follow every run of kanji with its reading in hiragana in square brackets: 学生[がくせい], 行[い]きます, 一緒[いっしょ]に. Only kanji get brackets; never bracket kana or katakana.
- Write the topic particle は as ^は and the direction particle へ as ^へ: 私[わたし]^は, 日本[にほん]^へ. は inside a word stays as is (はい, はじめまして), but the greeting is こんにち^は.
- Put a half-width space between phrases (文節) so a Korean pronunciation guide can be generated: 私[わたし]^は 韓国人[かんこくじん]です。
- Use Japanese punctuation (、。？). No romaji and no Korean inside Japanese fields.

Patterns the learner has studied:
${UNITS.map((u, i) => `Unit ${i + 1} ${u.title} (${u.goal}): ${u.phrases.map(p => p.text).join(' / ')}`).join('\n')}`;

const TALK_SCHEMA = {
  type: 'object',
  properties: {
    feedback: {
      type: 'object',
      properties: {
        status: { type: 'string', enum: ['none', 'good', 'fix', 'mixed', 'translate'] },
        words: {
          type: 'array',
          items: {
            type: 'object',
            properties: { ko: { type: 'string' }, ja: { type: 'string' } },
            required: ['ko', 'ja'],
            additionalProperties: false,
          },
        },
        corrected: { type: 'string' },
        note_ko: { type: 'string' },
      },
      required: ['status', 'words', 'corrected', 'note_ko'],
      additionalProperties: false,
    },
    reply: { type: 'string' },
    reply_ko: { type: 'string' },
    suggestions: {
      type: 'array',
      items: {
        type: 'object',
        properties: { ja: { type: 'string' }, ko: { type: 'string' } },
        required: ['ja', 'ko'],
        additionalProperties: false,
      },

  },
  required: ['feedback', 'reply', 'reply_ko', 'suggestions'],

// 내 Mac의 Ollama: 대화가 끊기지 않도록 두 번에 나눠 부른다.
// 1) 대답: 짧은 세 줄 텍스트(JA/KANA/KO)를 스트리밍해서 JA 줄이 끝나는 즉시 읽어 준다.
// 2) 피드백: 같은 대화 기록 뒤에 요청만 덧붙여 JSON으로 받는다. 앞부분이 같아서 Ollama 캐시를 그대로 쓴다.
// 작은 모델은 인라인 후리가나 표기를 잘 못 지켜서 일본어와 히라가나 읽기를 따로 받고, 후리가나·한글 발음은 페이지에서 만든다.
const OLLAMA_URL = 'http://localhost:11434';
const LOCAL_SYSTEM = `You are ゆき, a friendly Japanese conversation partner for a Korean beginner who finished a short crash course. You are having a real-time spoken conversation, so be quick and natural.

- Polite です/ます, very easy words (JLPT N5). One or two short sentences, then one easy question.
- Stay in the scenario from the first message. React to what the learner said, like a friend.
- The learner's message may mix Korean words, Japanese, and Japanese written in Hangul (와타시와 = わたしは, 데스 = です, 마시타 = ました, 토 = と, 오 = を). Work out what they meant and answer that. Ignore spelling and recognition errors. Don't correct them here; corrections are given separately.

Always answer in exactly these three lines and nothing else:
JA: your reply in natural Japanese with kanji
KANA: the same reply fully in hiragana, with a space between phrases
KO: Korean translation
Example:
JA: いいですね！どんな映画でしたか？
KANA: いいですね どんな えいがでしたか
KO: 좋네요! 어떤 영화였어요?

What the learner has studied: ${UNITS.map(u => `${u.title} (${u.goal})`).join('; ')}.`;

// 피드백 요청은 대화 기록 맨 끝에만 붙이고 기록에는 남기지 않는다 (앞부분 캐시 유지)
const LOCAL_FEEDBACK_RULES = `Pause the conversation. Answer only with JSON in the given schema.
- feedback.status: "none" if there is no learner message yet; "good" for correct, natural Japanese (if they wrote it in Hangul or romaji, put the Japanese in "corrected", otherwise leave it empty); "fix" for Japanese with a mistake ("corrected" is the natural version); "mixed" when they used some Korean words ("words" maps each Korean word to Japanese, "corrected" is the whole sentence in Japanese); "translate" when it was all Korean ("corrected" is the sentence in Japanese).
- Ignore spelling, kanji/kana choice and speech-recognition errors; judge grammar, particles, conjugation and word choice.
- feedback.note_ko: one short tip in casual Korean 반말 (…야, …해), or "".
- Every Japanese text is {"ja": normal Japanese with kanji, "kana": its full reading in hiragana with a space between phrases}. Empty text is {"ja":"","kana":""}.
- suggestions: exactly two short ANSWERS the learner could say back to your last reply (in the learner's voice, never your own question again), each with "ko".
Example for 「와타시와 어제 토모다치토 영화오 미마시타」:
{"feedback":{"status":"mixed","words":[{"ko":"어제","ja":"昨日","kana":"きのう"},{"ko":"영화","ja":"映画","kana":"えいが"}],"corrected":{"ja":"私は昨日友達と映画を見ました。","kana":"わたしは きのう ともだちと えいがを みました"},"note_ko":"\\"~랑\\"은 と로 말하면 돼."},"suggestions":[{"ja":"面白かったです。","kana":"おもしろかったです","ko":"재밌었어요."},{"ja":"アニメの映画です。","kana":"アニメの えいがです","ko":"애니메이션 영화예요."}]}`;

const JK = { type: 'object', properties: { ja: { type: 'string' }, kana: { type: 'string' } }, required: ['ja', 'kana'], additionalProperties: false };
const FEEDBACK_SCHEMA_LOCAL = {
  type: 'object',
  properties: {
    feedback: {
      type: 'object',
      properties: {
        status: TALK_SCHEMA.properties.feedback.properties.status,
        words: {
          type: 'array',
          items: { type: 'object', properties: { ko: { type: 'string' }, ja: { type: 'string' }, kana: { type: 'string' } }, required: ['ko', 'ja', 'kana'], additionalProperties: false },
        },
        corrected: JK,
        note_ko: { type: 'string' },
      },
      required: ['status', 'words', 'corrected', 'note_ko'],
      additionalProperties: false,
    },
    suggestions: {
      type: 'array',
      items: { type: 'object', properties: { ja: { type: 'string' }, kana: { type: 'string' }, ko: { type: 'string' } }, required: ['ja', 'kana', 'ko'], additionalProperties: false },
    },
  },
  required: ['feedback', 'suggestions'],
  additionalProperties: false,
};

// 「私は昨日映画を見ました」 + 「わたしは きのう えいがを みました」 → 私[わたし]は昨日[きのう]映画[えいが]を見[み]ました
const KANJI_ONLY = new RegExp(`^[${KANJI}]+$`, 'u');
const KANJI_ANY = new RegExp(`[${KANJI}]`, 'u');
const kanaOnly = s => [...s].map(hira).join('').replace(/[^ぁ-ゖー]/g, '');
// 읽기 안에 같은 가나가 또 나오면(友達[ともだち]と) 첫 매치가 틀리므로,
// 가능한 나눔을 모두 보고 한자 한 글자당 읽기 길이가 가장 자연스러운 것을 고른다
function alignRuby(ja, kana) {
  const k = kanaOnly(kana);
  const runs = ja.match(new RegExp(`[${KANJI}]+|[^${KANJI}]+`, 'gu')) || [];
  if (!k || !runs.some(r => KANJI_ONLY.test(r))) return ja;
  const lits = runs.map(r => (KANJI_ONLY.test(r) ? null : kanaOnly(r)));
  const reads = [];
  let best = null, bestScore = Infinity, steps = 0;
  (function go(ri, pos, score) {
    if (++steps > 20000 || score >= bestScore) return;
    if (ri === runs.length) {
      if (pos === k.length) { bestScore = score; best = reads.slice(); }
      return;
    }
    if (lits[ri] != null) {
      if (k.startsWith(lits[ri], pos)) go(ri + 1, pos + lits[ri].length, score);
      return;
    }
    const n = [...runs[ri]].length;
    for (let len = 1; len <= Math.min(k.length - pos, n * 4 + 1); len++) {
      reads.push(k.slice(pos, pos + len));
      go(ri + 1, pos + len, score + (len / n - 1.8) ** 2);
      reads.pop();
    }
  })(0, 0, 0);
  if (!best) return ja;
  let g = 0;
  return runs.map(r => (KANJI_ONLY.test(r) ? `${r}[${best[g++]}]` : r)).join('');
}
// 어절 끝의 は/へ는 조사로 보고 와/에로 읽는다 (こんにちは도 여기서 맞게 된다)
const kanaMarkup = kana => kana.trim().split(/\s+/).map(c => c.replace(/([はへ])([、。？！?!]*)$/, '^$1$2')).join(' ');
// 읽기에 띄어쓰기가 없을 때: 한자 단어·가타카나 단어·지시어·조사 바로 뒤의 は/へ를 조사로 본다
const markParticles = markup => markup
  .replace(/(\]|[ァ-ヺー]|これ|それ|あれ|どれ|ここ|そこ|どこ|こんにち|こんばん|わたし|あなた|で|に|と|の|から|まで)([はへ])/g, '$1^$2');
function prepJK(v) {
  if (!v || !str(v.ja)) return null;
  const markup = alignRuby(v.ja.trim(), str(v.kana));
  const p = prep({ j: markParticles(markup) });
  // 읽기가 어절로 띄어 있으면 그걸로 발음을 만들고, 아니면 후리가나를 붙인 표기로 만든다.
  // 후리가나 맞추기에 실패해 한자가 남았을 때만 띄어쓰기 없는 읽기를 쓴다
  if (/\S\s+\S/.test(str(v.kana))) p.pron = toHangul(parse(kanaMarkup(v.kana)));
  else if (str(v.kana) && markup === v.ja.trim() && KANJI_ANY.test(markup)) p.pron = toHangul(parse(markParticles(v.kana.trim())));
  return p;
}

// 세 줄 대답 "JA: …\nKANA: …\nKO: …" 읽기. 줄이 끝난 것만 돌려준다
function parseReplyLines(text, final) {
  const out = {};
  const lines = text.split('\n');
  if (!final) lines.pop();
  for (const line of lines) {
    const m = line.match(/^\s*(JA|KANA|KO)\s*[:：]\s*(.*)$/i);
    if (m && !out[m[1].toLowerCase()]) out[m[1].toLowerCase()] = m[2].trim();
  }
  // 형식을 안 지키고 일본어 한 줄만 쓴 경우
  if (final && !out.ja) out.ja = (lines.find(l => /[぀-ヿ一-鿿]/.test(l)) || '').trim();
  return out;
}

const ollama = { models: [], status: 'idle', warm: '', fbCtl: null };
const ollamaModel = () => prefs.ollamaModel || ollama.models[0] || 'qwen3:8b';
// num_ctx가 바뀌면 Ollama가 모델을 다시 올리므로 모든 요청이 같은 값을 쓴다
const OLLAMA_OPTS = { num_ctx: 8192, temperature: 0.6 };

async function checkOllama() {
  ollama.status = 'checking';
  renderOllamaStatus();
  try {
    const res = await fetch(`${OLLAMA_URL}/api/tags`);
    if (!res.ok) throw new Error(String(res.status));
    ollama.models = ((await res.json()).models || []).map(m => m.name);
    // 처음엔 대화가 빠른 작은 모델을 고른다
    if (!ollama.models.includes(prefs.ollamaModel)) {
      prefs.ollamaModel = ollama.models.find(m => /^qwen3:(8b|4b)/.test(m)) || ollama.models[0];
    }
    ollama.status = ollama.models.length ? 'ok' : 'empty';
  } catch (e) {
    ollama.status = 'fail';
  }
  if (view === 'talk' && prefs.talkEngine !== 'claude') renderTalk();
  if (ollama.status === 'ok') warmOllama();
}

// 대화에 보낼 메시지: 규칙, 장면 설정, 최근 대화
function ollamaMessages() {
  const recent = talk.messages.slice(1).slice(-24).map(m => ({
    role: m.role,
    content: Array.isArray(m.content) ? m.content.filter(b => b.type === 'text').map(b => b.text).join('') : m.content,
  }));
  return [{ role: 'system', content: LOCAL_SYSTEM }, talk.messages[0], ...recent];
}

// 스트리밍으로 받아 조각마다 onText(지금까지 전체)를 부른다
async function ollamaChat(messages, { format, onText, signal, options } = {}) {
  const model = ollamaModel();
  const body = { model, messages, stream: true, keep_alive: '30m', options: { ...OLLAMA_OPTS, ...options } };
  if (format) body.format = format;
  if (/qwen3|deepseek-r1/i.test(model)) body.think = false;
  let res;
  try {
    res = await fetch(`${OLLAMA_URL}/api/chat`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body), signal });
  } catch (e) {
    if (signal?.aborted) throw { local: 'aborted' };
    ollama.status = 'fail';
    throw { local: 'connect' };
  }
  if (res.status === 403) { ollama.status = 'fail'; throw { local: 'connect' }; }
  if (res.status === 404) throw { local: 'model', model };
  if (!res.ok || !res.body) throw { local: 'http', status: res.status };
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = '', text = '';
  try {
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, nl).trim();
        buf = buf.slice(nl + 1);
        if (!line) continue;
        let chunk;
        try { chunk = JSON.parse(line); } catch (e) { continue; }
        if (chunk.error) throw { local: 'http', status: chunk.error };
        const piece = chunk.message?.content || '';
        if (piece) { text += piece; onText?.(text); }
      }
    }
  } catch (e) {
    if (signal?.aborted) throw { local: 'aborted' };
    throw e.local ? e : { local: 'connect' };
  }
  return text;
}

// 모델을 메모리에 올리고 규칙 프롬프트를 미리 읽혀 둔다 → 첫 대답이 빨라진다
async function warmOllama() {
  const model = ollamaModel();
  if (ollama.warm === model) return;
  ollama.warm = model;
  try {
    await ollamaChat([{ role: 'system', content: LOCAL_SYSTEM }, { role: 'user', content: '.' }], { options: { num_predict: 1 } });
  } catch (e) {
    ollama.warm = '';
  }
}

// 대답 다음에 피드백과 대답 후보를 받는다. 그사이 학습자가 또 말하면 취소해서 대답이 밀리지 않게 한다
async function ollamaFeedback(me, ai) {
  ollama.fbCtl?.abort();
  const ctl = (ollama.fbCtl = new AbortController());
  const token = talk.token;
  ai.fbPending = true;
  renderChat(false);
  try {
    const ask = `[FEEDBACK] ${me ? `The learner's last message was 「${me.text}」.` : 'There is no learner message yet (status "none").'} Your last reply was 「${ai.text}」; the suggestions answer that.\n${LOCAL_FEEDBACK_RULES}`;
    const raw = await ollamaChat([...ollamaMessages(), { role: 'user', content: ask }], { format: FEEDBACK_SCHEMA_LOCAL, signal: ctl.signal });
    if (token !== talk.token) return;
    const out = JSON.parse(raw);
    const fb = out.feedback || {};
    const corrected = prepJK(fb.corrected);
    let status = fb.status;
    // 작은 모델이 "good"이라면서 다른 문장을 고쳐 주는 경우: 일본어로만 말했다면 고칠 점으로 본다
    if (me && status === 'good' && corrected && !/[가-힣]/.test(me.text) && norm(corrected.text) !== norm(me.text)) status = 'fix';
    if (me && (status === 'good' || (['fix', 'mixed', 'translate'].includes(status) && corrected))) {
      me.fb = {
        status,
        note: str(fb.note_ko),
        p: corrected,
        words: (Array.isArray(fb.words) ? fb.words : []).filter(w => w && str(w.ko))
          .map(w => { const p = prepJK(w); return p && Object.assign(p, { ko: w.ko.trim() }); }).filter(Boolean).slice(0, 6),
      };
    }
    ai.sugs = (Array.isArray(out.suggestions) ? out.suggestions : [])
      .map(s => { const p = s && prepJK(s); return p && Object.assign(p, { ko: str(s.ko) }); }).filter(Boolean).slice(0, 3);
  } catch (e) {
    // 피드백은 덤이라 실패해도 대화는 계속한다
  } finally {
    if (ollama.fbCtl === ctl) ollama.fbCtl = null;
    ai.fbPending = false;
    if (token === talk.token) renderChat(false);
  }
}

function localErrText(e) {
  if (e.local === 'connect') return 'Ollama에 연결하지 못했어요. 위의 "Ollama 연결이 안 되면"을 확인해 주세요.';
  if (e.local === 'model') return `'${e.model}' 모델이 없어요. 터미널에서 ollama pull ${e.model} 을 실행해 주세요.`;
  if (e.local === 'http') return `Ollama 오류 (${e.status}). 잠시 후 다시 시도해 주세요.`;
  return '답을 읽지 못했어요. 다시 시도해 주세요.';
}

const talk = { messages: [], log: [], busy: false, listening: false, typing: false, token: 0 };
let apiKey = '';
try { apiKey = localStorage.getItem(KEY_STORE) || ''; } catch (e) {}
let Anthropic = null;

async function callClaude() {
  if (!Anthropic) Anthropic = (await import(SDK_URL)).default;
  const client = new Anthropic({ apiKey, dangerouslyAllowBrowser: true });
  const model = MODELS.some(([id]) => id === prefs.talkModel) ? prefs.talkModel : MODELS[0][0];
  const params = {
    model,
    max_tokens: 8000,
    system: TALK_SYSTEM,
    messages: talk.messages,
    output_config: { effort: 'low', format: { type: 'json_schema', schema: TALK_SCHEMA } },
    cache_control: { type: 'ephemeral' },
  };
  // 안전 분류기가 거절하면 서버가 다른 모델로 다시 돌린다 (Haiku 5.5는 서버 측 fallback 없음)
  if (model !== 'claude-haiku-5-5') Object.assign(params, { betas: ['server-side-fallback-2026-07-01'], fallbacks: 'default' });
  return client.beta.messages.parse(params);
}

function errText(e) {
  if (Anthropic && e instanceof Anthropic.AuthenticationError) return 'API 키가 올바르지 않아요. 키를 지우고 다시 넣어 주세요.';
  if (Anthropic && e instanceof Anthropic.PermissionDeniedError) return '이 API 키로는 선택한 모델을 쓸 수 없어요. 다른 모델을 골라 보세요.';
  if (Anthropic && e instanceof Anthropic.RateLimitError) return '요청이 너무 많아요. 잠시 후 다시 시도해 주세요.';
  if (Anthropic && e instanceof Anthropic.BadRequestError) return `요청이 거부됐어요: ${e.message}`;
  if (Anthropic && e instanceof Anthropic.APIConnectionError) return '서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.';
  if (Anthropic && e instanceof Anthropic.APIError) return `API 오류 (${e.status ?? '?'}): ${e.message}`;
  if (!Anthropic) return 'Claude SDK를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.';
  return '응답을 읽지 못했어요. 다시 시도해 주세요.';
}

const str = v => (typeof v === 'string' ? v : '');

async function send() {
  const token = talk.token;
  talk.busy = true;
  renderChat();
  setComposer();
  if (prefs.talkEngine !== 'claude') return sendLocal(token);
  try {
    const res = await callClaude();
    if (token !== talk.token) return;
    if (res.stop_reason === 'refusal') {
      talk.messages.pop();
      talk.log.push({ who: 'err', text: '이 말에는 답할 수 없대요. 다른 말로 해 보세요.' });
    } else {
      const out = res.parsed_output;
      if (!out) throw new Error('no output');
      // thinking·fallback 블록까지 그대로 돌려줘야 다음 턴에서 대화 기록이 유지된다
      talk.messages.push({ role: 'assistant', content: res.content });
      const mk = v => (str(v) ? prep({ j: v }) : null);
      const withKo = (p, ko) => (p ? Object.assign(p, { ko: str(ko).trim() }) : null);
      const me = talk.log[talk.log.length - 1];
      const fb = out.feedback || {};
      const corrected = mk(fb.corrected);
      if (me && me.who === 'me' && (fb.status === 'good' || (['fix', 'mixed', 'translate'].includes(fb.status) && corrected))) {
        me.fb = {
          status: fb.status,
          note: str(fb.note_ko),
          p: corrected,
          words: (Array.isArray(fb.words) ? fb.words : []).filter(w => w && str(w.ko))
            .map(w => withKo(mk(w.ja), w.ko)).filter(Boolean).slice(0, 6),
        };
      }
      const ai = mk(out.reply);
      ai.who = 'ai';
      ai.ko = str(out.reply_ko);
      ai.sugs = (Array.isArray(out.suggestions) ? out.suggestions : [])
        .map(s => s && withKo(mk(s.ja), s.ko)).filter(Boolean).slice(0, 3);
      talk.log.push(ai);
      if (prefs.talkAuto !== false) speak(ai.text, { onend: autoListen });
    }
  } catch (e) {
    if (token !== talk.token) return;
    talk.log.push({ who: 'err', text: errText(e), retry: true });
  }
  finishTurn();
}

function finishTurn() {
  talk.busy = false;
  renderChat();
  setComposer();
  if (talk.listenAfter) { talk.listenAfter = false; autoListen(); }
}

// ゆき가 말을 마치면 바로 마이크를 연다 (자동 듣기)
function autoListen() {
  if (prefs.talkHands === false || !SR || view !== 'talk' || !$('#drill').hidden || talk.listening) return;
  if ('speechSynthesis' in window && (speechSynthesis.speaking || speechSynthesis.pending)) return;
  if (talk.busy) { talk.listenAfter = true; return; }
  talkListen('ja');
}

// 로컬: 대답 세 줄을 스트리밍해 JA 줄이 끝나는 즉시 보여 주고 읽은 뒤, 피드백은 따로 받는다
async function sendLocal(token) {
  ollama.fbCtl?.abort();
  const last = talk.log[talk.log.length - 1];
  const me = last && last.who === 'me' ? last : null;
  let spoke = false, ai = null;
  const say = p => {
    if (spoke || prefs.talkAuto === false) return;
    spoke = true;
    speak(p.text, { onend: autoListen });
  };
  try {
    const text = await ollamaChat(ollamaMessages(), {
      options: { num_predict: 200 },
      onText: t => {
        if (token !== talk.token) return;
        const r = parseReplyLines(t, false);
        const p = r.ja && prepJK({ ja: r.ja, kana: r.kana || '' });
        if (!p) return;
        talk.pending = Object.assign(p, { ko: r.ko || '' });
        say(p);
        renderChat();
      },
    });
    if (token !== talk.token) return;
    const r = parseReplyLines(text, true);
    ai = prepJK({ ja: r.ja, kana: r.kana || '' });
    if (!ai) throw { local: 'json' };
    talk.messages.push({ role: 'assistant', content: text.trim() });
    Object.assign(ai, { who: 'ai', ko: r.ko || '', sugs: [] });
    talk.pending = null;
    talk.log.push(ai);
    say(ai);
  } catch (e) {
    if (token !== talk.token) return;
    talk.pending = null;
    talk.log.push({ who: 'err', text: localErrText(e), retry: true });
  }
  finishTurn();
  if (ai) ollamaFeedback(me, ai);
}

const engineReady = () => (prefs.talkEngine === 'claude' ? !!apiKey : ollama.status !== 'fail');

function startTalk() {
  if (prefs.talkEngine === 'claude' && !apiKey) return toast('API 키를 먼저 넣어 주세요.');
  talk.token++;
  rec?.abort();
  ollama.fbCtl?.abort();
  talk.pending = null;
  talk.listenAfter = false;
  const scene = SCENES.find(s => s[0] === prefs.talkScene) || SCENES[0];
  const level = prefs.talkLevel === 'intro' ? '입문 (use only the unit 1–4 patterns)' : '초급 (all units)';
  talk.messages = [{
    role: 'user',
    content: `Start a new conversation. Scenario: ${scene[2]} Level: ${level}. You speak first: a greeting and one easy question.${prefs.talkEngine === 'claude' ? ' feedback.status is "none".' : ''}`,
  }];
  talk.log = [];
  talk.listening = false;
  send();
}

// via: 'ja' 일본어 인식기, 'mix' 한국어 인식기(섞어 말하기), 'type' 직접 입력
function userSay(text, via) {
  text = text.trim();
  if (!text || talk.busy || !talk.messages.length) return;
  talk.log.push({ who: 'me', text, via });
  // 로컬 모델은 대답 형식을 자주 잊어서 매 턴 끝에 다시 알려 준다
  const tail = prefs.talkEngine === 'claude' ? '' : '\nReply now in the three lines JA / KANA / KO.';
  talk.messages.push({
    role: 'user',
    content: (via === 'mix' ? `The learner spoke, maybe mixing Korean and Japanese (Korean speech recognizer, so Japanese parts appear in Hangul phonetic spelling): 「${text}」`
      : via === 'ja' ? `The learner said (Japanese speech recognizer): 「${text}」`
      : `The learner typed (may mix Korean and Japanese): 「${text}」`) + tail,
  });
  send();
}

// 일본어/한국어로 듣고 그대로 대화에 보낸다
function talkListen(lang) {
  if (!SR || talk.busy || !talk.messages.length) return;
  if (talk.listening) { rec?.stop(); return; }
  const token = talk.token;
  talk.listening = lang;
  setComposer();
  listen({
    lang: lang === 'ko' ? 'ko-KR' : 'ja-JP',
    onInterim: t => { if (token === talk.token) $('#talk-live').textContent = t; },
    onDone: ({ transcripts, error }) => {
      if (token !== talk.token) return;
      talk.listening = false;
      setComposer();
      if (!transcripts.length) {
        $('#talk-live').classList.add('err');
        $('#talk-live').textContent = SR_ERR[error] || SR_ERR['no-speech'];
        return;
      }
      userSay(transcripts[0], lang === 'ko' ? 'mix' : 'ja');
    },
  });
}

// 고쳐 준 문장을 따라 말하면 기존 채점기로 점수를 매긴다
function tryCorrection(i) {
  const e = talk.log[i];
  if (!SR || talk.busy || !e?.fb?.p) return;
  if (talk.listening) { rec?.stop(); return; }
  const token = talk.token;
  talk.listening = 'fb';
  e.trying = true;
  e.tryMsg = '';
  renderChat(false);
  setComposer();
  listen({
    onInterim: () => {},
    onDone: ({ transcripts, error }) => {
      if (token !== talk.token) return;
      talk.listening = false;
      e.trying = false;
      if (transcripts.length) {
        const r = grade(e.fb.p, transcripts);
        e.fb.score = Math.round(r.score * 100);
        e.fb.status2 = r.status;
        e.tryMsg = `들은 말: ${r.heard}`;
      } else {
        e.tryMsg = SR_ERR[error] || SR_ERR['no-speech'];
      }
      renderChat(false);
      setComposer();
    },
  });
}

function entryHTML(e, i, last) {
  if (e.who === 'err') {
    return `<div class="msg sys"><div class="bubble err">${esc(e.text)}${e.retry ? '<button class="link" data-talk="retry">다시 시도</button>' : ''}</div></div>`;
  }
  if (e.who === 'ai') {
    const sugs = last && e.sugs.length ? `<div class="sugs"><div class="sugs-lab">이렇게 대답해 볼까요? (누르면 들려줘요)</div>${
      e.sugs.map((s, j) => `<button class="sug" data-sug="${i}.${j}"><span class="ja" lang="ja">${rubyHTML(s.segs)}</span><span class="pr">${esc(s.pron)}</span><span class="ko">${esc(s.ko)}</span></button>`).join('')}</div>` : '';
    return `<div class="msg ai"><div class="who">ゆき</div><div class="bubble">
      <div class="ja" lang="ja">${rubyHTML(e.segs)}</div>
      <div class="pr">${esc(e.pron)}</div>
      ${e.ko ? `<div class="ko">${esc(e.ko)}</div>` : ''}
      <div class="acts"><button class="icon-btn sm" data-say="${i}" aria-label="듣기">${ICON.play}</button><button class="btn sm" data-say-slow="${i}">천천히</button></div>
    </div>${sugs}${e.fbPending ? '<div class="sugs-lab">고칠 점·대답 후보 정리하는 중…</div>' : ''}</div>`;
  }
  const f = e.fb;
  let fb = '';
  if (f && f.status === 'good') {
    // 한글 발음으로 맞게 말했으면 일본어로 어떻게 쓰는지도 보여 준다
    const written = f.p && /[가-힣]/.test(e.text)
      ? `<div class="fb-say">일본어로 쓰면 <span class="ja" lang="ja">「${rubyHTML(f.p.segs)}」</span></div><div class="pr">${esc(f.p.pron)}</div>` : '';
    fb = `<div class="fb good">✓ 완벽해!${f.note ? ` ${esc(f.note)}` : ''}${written}</div>`;
  }
  else if (f && f.p) {
    const words = (f.words || []).map((w, j) => `<button class="fb-word" data-word="${i}.${j}">일본어로 <b>'${esc(w.ko)}'</b>${topicJosa(w.ko)} <span class="jp" lang="ja">${rubyHTML(w.segs)}</span><span class="pr">(${esc(w.pron)})</span>${copula(w.pron)}.</button>`).join('');
    fb = `<div class="fb">
      ${words}
      <div class="fb-say"><span class="ja" lang="ja">「${rubyHTML(f.p.segs, f.status2)}」</span>${f.status === 'translate' ? '라고 하면 돼.' : '라고 말했으면 더 좋았겠지?'}</div>
      <div class="pr">${esc(f.p.pron)}</div>
      ${f.note ? `<div class="fb-note">${esc(f.note)}</div>` : ''}
      <div class="acts">
        <button class="icon-btn sm" data-fb-say="${i}" aria-label="듣기">${ICON.play}</button>
        <button class="btn sm${e.trying ? ' on' : ''}" data-fb-try="${i}"${SR ? '' : ' disabled'}>${e.trying ? ICON.stop : ICON.mic} ${e.trying ? '듣는 중' : '따라 말하기'}</button>
        ${f.score != null ? badge(f.score) : ''}
      </div>
      ${e.tryMsg ? `<div class="heard">${esc(e.tryMsg)}</div>` : ''}
    </div>`;
  }
  const hangul = /[가-힣]/.test(e.text);
  return `<div class="msg me"><div class="who">나${e.via === 'mix' ? ' · 섞어서' : e.via === 'ja' ? ' · 음성' : ''}</div>
    <div class="bubble"${hangul ? '' : ' lang="ja"'}>${esc(e.text)}</div>${fb}</div>`;
}

// '어제'는 / '학생'은, 昨日(키노-)야 / 本(혼)이야
const hasFinal = s => { const x = lastSyl(s); return x >= 0 && x % 28 !== 0; };
const topicJosa = w => (hasFinal(w) ? '은' : '는');
const copula = pron => (hasFinal(pron) ? '이야' : '야');

function renderChat(scroll = true) {
  const chat = $('#chat');
  if (!chat) return;
  if (!talk.log.length && !talk.busy) {
    chat.innerHTML = `<div class="empty">
      <p>장면을 고르고 시작하면 ゆき가 먼저 말을 걸어요.<br>마이크를 누르고 일본어로 대답하세요. 모르는 단어가 있으면 <b>섞어서</b> 버튼을 누르고<br>그 부분만 한국어로 말해도 돼요. 일본어로 뭐라고 하는지 알려 줘요.</p>
      <button class="btn primary" data-talk="start"${engineReady() ? '' : ' disabled'}>${ICON.chat} 대화 시작</button></div>`;
    return;
  }
  const lastAi = talk.log.map(e => e.who).lastIndexOf('ai');
  const p = talk.busy && talk.pending;
  chat.innerHTML = talk.log.map((e, i) => entryHTML(e, i, i === lastAi && i === talk.log.length - 1 && !talk.busy)).join('')
    + (p ? `<div class="msg ai"><div class="who">ゆき</div><div class="bubble">
        <div class="ja" lang="ja">${rubyHTML(p.segs)}</div><div class="pr">${esc(p.pron)}</div>${p.ko ? `<div class="ko">${esc(p.ko)}</div>` : ''}
        </div></div>`
      : talk.busy ? '<div class="msg ai"><div class="who">ゆき</div><div class="bubble typing" aria-label="입력 중"><span></span><span></span><span></span></div></div>' : '');
  if (scroll) $('#composer')?.scrollIntoView({ block: 'end', behavior: 'smooth' });
}

function setComposer() {
  const mic = $('#talk-mic');
  if (!mic) return;
  const ready = !!SR && !talk.busy && talk.messages.length > 0;
  const on = talk.listening === 'ja';
  mic.classList.toggle('on', on);
  mic.innerHTML = on ? ICON.stop : ICON.mic;
  mic.disabled = !ready || (talk.listening && !on);
  mic.setAttribute('aria-label', on ? '그만 듣기' : '일본어로 말하기');
  const ko = $('#talk-ko');
  ko.classList.toggle('on', talk.listening === 'ko');
  ko.disabled = !ready || (talk.listening && talk.listening !== 'ko');
  ko.hidden = !SR;
  mic.hidden = !SR;
  $('#talk-type').hidden = !SR;
  $('#talk-form button').disabled = talk.busy || !talk.messages.length;
  const live = $('#talk-live');
  if (talk.busy) { live.className = 'live'; live.textContent = 'ゆき가 생각하는 중…'; }
  else if (talk.listening === 'ja') { live.className = 'live'; live.textContent = '일본어로 말해 보세요…'; }
  else if (talk.listening === 'ko') { live.className = 'live'; live.textContent = '한국어·일본어 섞어서 말해 보세요…'; }
  else if (!live.classList.contains('err')) live.textContent = !talk.messages.length ? '' : SR ? '마이크를 눌러 대답하세요 (Space)' : '아래에 입력해서 대답하세요';
}

function onTalkClick(e) {
  const t = e.target.closest('button, [data-sug]');
  if (!t) return;
  const ds = t.dataset, entry = i => talk.log[+i];
  if (ds.talk === 'start') startTalk();
  else if (ds.talk === 'retry') { talk.log = talk.log.filter(x => x.who !== 'err'); send(); }
  else if (ds.talk === 'ollama-check') checkOllama();
  else if (ds.say != null) speak(entry(ds.say).text, { btn: t });
  else if (ds.saySlow != null) speak(entry(ds.saySlow).text, { slow: true, btn: t });
  else if (ds.sug != null) { const [i, j] = ds.sug.split('.'); speak(entry(i).sugs[+j].text); }
  else if (ds.fbSay != null) speak(entry(ds.fbSay).fb.p.text, { btn: t });
  else if (ds.word != null) { const [i, j] = ds.word.split('.'); speak(entry(i).fb.words[+j].text); }
  else if (ds.fbTry != null) tryCorrection(+ds.fbTry);
  else if (t.id === 'talk-mic') talkListen('ja');
  else if (t.id === 'talk-ko') talkListen('ko');
  else if (t.id === 'talk-type') { talk.typing = !talk.typing; $('#talk-form').hidden = !talk.typing; if (talk.typing) $('#talk-input').focus(); }
  else if (t.id === 'talk-trans') { prefs.talkTrans = prefs.talkTrans === false; store.save(); applyPrefs(); t.setAttribute('aria-pressed', prefs.talkTrans); }
  else if (t.id === 'talk-auto') { prefs.talkAuto = prefs.talkAuto === false; store.save(); t.setAttribute('aria-pressed', prefs.talkAuto); }
  else if (t.id === 'talk-hands') { prefs.talkHands = prefs.talkHands === false; store.save(); t.setAttribute('aria-pressed', prefs.talkHands); }
  else if (t.id === 'talk-key-clear') {
    apiKey = '';
    try { localStorage.removeItem(KEY_STORE); } catch (err) {}
    renderTalk();
  }
}

$('#lesson').addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'key-form') {
    const k = $('#key-input').value.trim();
    if (!k) return;
    apiKey = k;
    try { localStorage.setItem(KEY_STORE, k); } catch (err) { toast('이 브라우저에선 키를 저장할 수 없어서 이번 방문에만 써요.'); }
    renderTalk();
  } else if (e.target.id === 'talk-form') {
    const input = $('#talk-input');
    if (talk.busy || !talk.messages.length || !input.value.trim()) return;
    userSay(input.value, 'type');
    input.value = '';
  }
});
$('#lesson').addEventListener('change', e => {
  const key = { 'talk-scene': 'talkScene', 'talk-level': 'talkLevel', 'talk-model': 'talkModel', 'talk-engine': 'talkEngine', 'ollama-model': 'ollamaModel' }[e.target.id];
  if (!key) return;
  prefs[key] = e.target.value;
  store.save();
  // 엔진·모델은 진행 중인 대화에도 다음 턴부터 바로 적용된다
  if (key === 'talkEngine') renderTalk();
  else if (key === 'ollamaModel') warmOllama();
  else if ((key === 'talkScene' || key === 'talkLevel') && talk.messages.length) toast('새 대화부터 적용돼요.');
});

// ----- 이벤트 -----
$('#units').addEventListener('click', e => {
  if (e.target.closest('[data-view="talk"]')) return selectTalk();
  const b = e.target.closest('[data-ui]');
  if (b) selectUnit(+b.dataset.ui);
});
$('#review').addEventListener('click', startReview);

$('#lesson').addEventListener('click', e => {
  if (view === 'talk') return onTalkClick(e);
  const u = UNITS[cur], start = e.target.closest('[data-start]');
  if (start) {
    const mode = start.dataset.start;
    return openDrill({ items: u.phrases, mode, unit: cur, title: `${u.title} · ${mode === 'shadow' ? '따라 말하기' : '보고 말하기'}` });
  }
  const row = e.target.closest('.phrase');
  if (!row) return;
  const p = u.phrases[+row.dataset.pi];
  if (e.target.closest('[data-play]')) speak(p.text, { btn: e.target.closest('[data-play]') });
  else if (e.target.closest('[data-open]')) {
    openDrill({ items: u.phrases.slice(p.pi), mode: 'shadow', unit: cur, title: `${u.title} · 따라 말하기` });
  }
});
$('#lesson').addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.txt')) { e.preventDefault(); e.target.click(); }
});

$('#d-close').addEventListener('click', closeDrill);
$('#d-mic').addEventListener('click', onMic);
$('#d-next').addEventListener('click', next);
$('#d-listen').addEventListener('click', e => speak(item().text, { btn: e.currentTarget }));
$('#d-slow').addEventListener('click', e => speak(item().text, { slow: true, btn: e.currentTarget }));
$('#d-hint').addEventListener('click', () => { drill.hinted = true; paintAnswer(null); });
$('#d-summary').addEventListener('click', e => {
  const act = e.target.closest('[data-sum]')?.dataset.sum;
  if (act === 'weak') openDrill({ items: drill.weak, mode: drill.mode, unit: drill.unit, title: `${drill.title.replace(/ · 다시$/, '')} · 다시` });
  else if (act === 'next') { const ui = drill.unit + 1; closeDrill(); selectUnit(ui); }
  else if (act === 'close') closeDrill();
});

document.addEventListener('keydown', e => {
  if ($('#drill').hidden) {
    const typingField = e.target.closest?.('input, select, textarea, [contenteditable]');
    if (view === 'talk' && e.code === 'Space' && !typingField && !e.repeat && !e.metaKey && !e.ctrlKey && !e.altKey) {
      e.preventDefault();
      document.activeElement?.blur?.();
      talkListen(talk.listening === 'ko' ? 'ko' : 'ja');
    }
    return;
  }
  if (e.key === 'Escape') return closeDrill();
  if (!$('#d-summary').hidden || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.code === 'Space') {
    e.preventDefault();
    if (e.repeat) return;
    document.activeElement?.blur?.();
    onMic();
  } else if (e.key === 'ArrowRight' || (e.key === 'Enter' && drill.state === 'graded' && !(e.target instanceof HTMLButtonElement))) {
    next();
  } else if (e.key.toLowerCase() === 'p' && (answerShown() || drill.hinted)) {
    speak(item().text, { btn: $('#d-listen') });
  }
});

function applyPrefs() {
  document.body.classList.toggle('no-furi', !prefs.furi);
  document.body.classList.toggle('no-pron', !prefs.pron);
  document.body.classList.toggle('no-trans', prefs.talkTrans === false);
  $('#t-furi').setAttribute('aria-pressed', prefs.furi);
  $('#t-pron').setAttribute('aria-pressed', prefs.pron);
}
$('#t-furi').addEventListener('click', () => { prefs.furi = !prefs.furi; store.save(); applyPrefs(); });
$('#t-pron').addEventListener('click', () => {
  prefs.pron = !prefs.pron;
  store.save();
  applyPrefs();
  if (!$('#drill').hidden && !$('#d-play').hidden) paintAnswer(null);
});
$('#voice').addEventListener('change', e => { prefs.voice = e.target.value; store.save(); });

// ----- 시작 -----
$('#d-close').innerHTML = ICON.close;
$('#d-listen').innerHTML = `${ICON.play} 듣기`;
$('#d-slow').innerHTML = `${ICON.play} 천천히`;
if (!SR || !window.isSecureContext) {
  const b = $('#sr-banner');
  b.hidden = false;
  b.textContent = !window.isSecureContext
    ? '마이크는 https 주소에서만 쓸 수 있어요. 듣기와 읽기는 그대로 쓸 수 있어요.'
    : IS_BRAVE
    ? 'Brave는 음성 인식을 막아 두어서 마이크 채점이 동작하지 않아요. Safari나 Chrome으로 열어 주세요. 듣기와 읽기는 그대로 쓸 수 있어요.'
    : '이 브라우저는 음성 인식을 지원하지 않아요. Chrome · Edge · Safari에서 열어 주세요. 듣기와 읽기는 그대로 쓸 수 있어요.';
}
if ('speechSynthesis' in window) {
  loadVoices();
  speechSynthesis.addEventListener?.('voiceschanged', loadVoices);
} else {
  $('#voice').closest('.chip').hidden = true;
}
applyPrefs();
renderNav();
renderMain();
</script>
</body>
</html>
