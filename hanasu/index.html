<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>はなす · 말하는 일본어</title>
<!-- Google Analytics (GA4) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2S4N123Q9E"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-2S4N123Q9E');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f6f3ec; --panel:#fffdf8; --panel2:#eeeae1; --line:#e3ddd1; --ink:#1c1a17; --ink2:#67615a; --ink3:#9a948a;
    --accent:#cf412a; --accent-ink:#fff; --accent-soft:rgba(207,65,42,.10);
    --ok:#1d8a4b; --ok-soft:rgba(29,138,75,.12); --mid:#a86400; --bad:#c8372a; --bad-soft:rgba(200,55,42,.11);
    --shadow:0 8px 28px rgba(40,30,20,.09);
    --jp:'Noto Sans JP', sans-serif; --kr:'Noto Sans KR', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#131211; --panel:#1c1b19; --panel2:#282623; --line:#302e2a; --ink:#f3efe8; --ink2:#aaa398; --ink3:#746e66;
      --accent:#ff7a5f; --accent-ink:#1a0c08; --accent-soft:rgba(255,122,95,.13);
      --ok:#5fd38d; --ok-soft:rgba(95,211,141,.14); --mid:#f1b64c; --bad:#ff7d6e; --bad-soft:rgba(255,125,110,.15);
      --shadow:0 8px 28px rgba(0,0,0,.45);
    }
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  [hidden] { display:none !important; }
  html { -webkit-text-size-adjust:100%; }
  body {
    min-height:100vh; min-height:100dvh;
    background:var(--bg); color:var(--ink);
    font-family:var(--kr); line-height:1.6;
    -webkit-tap-highlight-color:transparent;
  }
  body.drilling { overflow:hidden; }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
  button:disabled { cursor:default; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  a { color:var(--accent); }
  .jp { font-family:var(--jp); }
  ruby rt { font-size:.5em; color:var(--ink3); font-weight:400; }
  body.no-furi rt { display:none; }
  body.no-pron .pr { display:none; }

  .wrap { max-width:1080px; margin:0 auto; padding:28px 20px 64px; }

  /* 헤더 */
  header.top { display:flex; flex-wrap:wrap; gap:20px 32px; align-items:flex-end; justify-content:space-between;
    padding-bottom:20px; border-bottom:1px solid var(--line); }
  .brand h1 { font-family:var(--jp); font-size:2.4rem; font-weight:700; line-height:1.1; letter-spacing:.04em; }
  .brand h1 b { color:var(--accent); }
  .brand p { color:var(--ink2); margin-top:6px; }
  .side { display:flex; flex-direction:column; gap:12px; min-width:260px; }
  .overall .label { display:flex; justify-content:space-between; font-size:.85rem; color:var(--ink2); margin-bottom:6px; }
  .overall .label b { color:var(--ink); font-variant-numeric:tabular-nums; }
  .bar { height:6px; border-radius:99px; background:var(--panel2); overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--accent); border-radius:inherit; transition:width .4s ease; }
  .settings { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { border:1px solid var(--line); background:var(--panel); color:var(--ink2); font-size:.82rem;
    padding:5px 12px; border-radius:99px; display:inline-flex; align-items:center; gap:6px; }
  .chip[aria-pressed="true"] { background:var(--ink); border-color:var(--ink); color:var(--bg); }
  .chip select { font:inherit; color:var(--ink); background:transparent; border:0; max-width:130px; cursor:pointer; }
  .chip select option { color:#000; }

  .banner { margin-top:16px; padding:12px 16px; border-radius:12px; background:var(--bad-soft); color:var(--bad); font-size:.9rem; }

  /* 레이아웃 */
  .layout { display:grid; grid-template-columns:250px minmax(0,1fr); gap:32px; margin-top:24px; align-items:start; }
  nav.units { position:sticky; top:16px; display:flex; flex-direction:column; gap:2px; }
  .unit-btn { display:grid; grid-template-columns:26px 1fr auto; align-items:center; gap:10px;
    text-align:left; padding:9px 12px; border-radius:12px; }
  .unit-btn:hover { background:var(--panel2); }
  .unit-btn[aria-current="true"] { background:var(--panel); box-shadow:var(--shadow); }
  .unit-btn .n { font-size:.75rem; font-weight:700; color:var(--ink3); font-variant-numeric:tabular-nums; }
  .unit-btn[aria-current="true"] .n { color:var(--accent); }
  .unit-btn .t { display:flex; flex-direction:column; font-weight:500; font-size:.95rem; line-height:1.35; }
  .unit-btn .s { font-family:var(--jp); font-size:.72rem; color:var(--ink3); font-weight:400; }
  .unit-btn .p { font-size:.75rem; color:var(--ink3); font-variant-numeric:tabular-nums; }
  .unit-btn.done .p { color:var(--ok); font-weight:700; }
  .review-btn { margin-top:10px; padding:10px 12px; border-radius:12px; border:1px dashed var(--line);
    color:var(--ink2); font-size:.88rem; text-align:left; }
  .review-btn:hover { border-color:var(--accent); color:var(--accent); }

  /* 단원 */
  .unit-head { display:flex; flex-wrap:wrap; gap:16px 24px; align-items:flex-end; justify-content:space-between; }
  .eyebrow { font-size:.78rem; font-weight:700; letter-spacing:.1em; color:var(--accent); }
  .unit-head h2 { font-size:1.75rem; line-height:1.3; }
  .goal { color:var(--ink2); }
  .start { display:flex; flex-direction:column; gap:6px; align-items:flex-end; }
  .start-btns { display:flex; gap:8px; flex-wrap:wrap; }
  .start-hint { font-size:.78rem; color:var(--ink3); }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:10px 16px;
    border-radius:12px; border:1px solid var(--line); background:var(--panel); font-weight:500; font-size:.95rem; }
  .btn:hover { border-color:var(--ink3); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn.primary:hover { filter:brightness(1.06); }
  .btn svg { width:18px; height:18px; flex:none; }
  .btn.playing { border-color:var(--accent); color:var(--accent); }

  .note { margin-top:22px; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px 20px; }
  .note summary { cursor:pointer; font-weight:700; font-size:.95rem; }
  .note-body { margin-top:10px; font-size:.93rem; }
  .note-body p { margin-bottom:8px; }
  .note-body ul { padding-left:1.1em; }
  .note-body li { margin:5px 0; }
  .note-body .jp { font-size:1.02em; }
  .note-body table { border-collapse:collapse; margin:10px 0 12px; width:100%; font-size:.9rem; }
  .note-body th, .note-body td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:bottom; }
  .note-body th { color:var(--ink2); font-weight:500; white-space:nowrap; }
  .table-scroll { overflow-x:auto; }

  .phrases { list-style:none; margin-top:18px; display:flex; flex-direction:column; gap:8px; }
  .phrase { display:grid; grid-template-columns:40px minmax(0,1fr) auto 40px; gap:14px; align-items:center;
    padding:12px 14px; background:var(--panel); border:1px solid var(--line); border-radius:14px; }
  .phrase .txt { cursor:pointer; border-radius:8px; }
  .phrase .ja { font-family:var(--jp); font-size:1.22rem; line-height:1.95; }
  .phrase .pr { font-size:.85rem; color:var(--accent); }
  .phrase .ko { font-size:.88rem; color:var(--ink2); }
  .icon-btn { width:40px; height:40px; border-radius:50%; display:grid; place-items:center; background:var(--panel2); color:var(--ink2); flex:none; }
  .icon-btn:hover, .icon-btn.playing { color:var(--accent); }
  .icon-btn svg { width:18px; height:18px; }
  .badge { min-width:44px; text-align:center; font-size:.8rem; font-weight:700; font-variant-numeric:tabular-nums;
    padding:3px 8px; border-radius:99px; background:var(--panel2); color:var(--ink3); }
  .badge.pass { background:var(--ok-soft); color:var(--ok); }
  .badge.fail { background:var(--bad-soft); color:var(--bad); }

  footer { margin-top:48px; padding-top:20px; border-top:1px solid var(--line); font-size:.82rem; color:var(--ink3); }
  footer p + p { margin-top:4px; }

  /* 연습 화면 */
  .drill { position:fixed; inset:0; z-index:10; background:var(--bg); overflow-y:auto; }
  .drill-inner { max-width:640px; min-height:100%; margin:0 auto; display:flex; flex-direction:column; gap:18px;
    padding:max(16px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); }
  .drill-top { display:flex; align-items:center; gap:12px; }
  .drill-top .lab { flex:1; font-size:.92rem; font-weight:500; color:var(--ink2); }
  .drill-top .cnt { font-size:.9rem; color:var(--ink2); font-variant-numeric:tabular-nums; }
  #d-play { display:flex; flex-direction:column; gap:18px; flex:1; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:24px; box-shadow:var(--shadow);
    padding:32px 24px; min-height:210px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px; text-align:center; }
  .big-ko { font-size:clamp(1.3rem, 5vw, 1.75rem); font-weight:700; line-height:1.45; }
  .big-ja { font-family:var(--jp); font-size:clamp(1.6rem, 6.4vw, 2.4rem); font-weight:500; line-height:2; }
  .card .pr { color:var(--accent); }
  .card .ko { color:var(--ink2); }
  .seg.ok { color:var(--ok); }
  .seg.bad { color:var(--bad); background:var(--bad-soft); border-radius:6px; }
  .link { color:var(--ink3); font-size:.88rem; text-decoration:underline; text-underline-offset:3px; }
  .link:hover { color:var(--accent); }
  .audio-row { display:flex; gap:8px; justify-content:center; }
  .mic-area { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .mic { position:relative; width:84px; height:84px; border-radius:50%; display:grid; place-items:center;
    background:var(--accent); color:var(--accent-ink); box-shadow:0 10px 28px var(--accent-soft), 0 4px 10px rgba(0,0,0,.12);
    transition:transform .15s ease; }
  .mic:active { transform:scale(.95); }
  .mic svg { width:32px; height:32px; }
  .mic.on::before, .mic.on::after { content:''; position:absolute; inset:-6px; border-radius:50%;
    border:2px solid var(--accent); animation:pulse 1.6s ease-out infinite; }
  .mic.on::after { animation-delay:.8s; }
  .mic:disabled { background:var(--panel2); color:var(--ink3); box-shadow:none; }
  @keyframes pulse { from { transform:scale(.92); opacity:.85; } to { transform:scale(1.4); opacity:0; } }
  .mic-cap { font-size:.84rem; color:var(--ink3); text-align:center; }
  .heard { min-height:1.7em; text-align:center; font-family:var(--jp); color:var(--ink2); }
  .heard .lab { font-family:var(--kr); font-size:.76rem; color:var(--ink3); margin-right:8px; }
  .heard.err { font-family:var(--kr); color:var(--bad); font-size:.9rem; }
  .result { display:flex; align-items:center; justify-content:center; gap:14px; }
  .ring { width:72px; height:72px; flex:none; }
  .ring circle { fill:none; stroke-width:6; }
  .ring .track { stroke:var(--panel2); }
  .ring .val { stroke-linecap:round; transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1); }
  .ring text { font:700 19px var(--kr); fill:var(--ink); }
  .verdict b { display:block; font-size:1.15rem; }
  .verdict small { color:var(--ink3); font-size:.84rem; }
  .drill-foot { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:auto; padding-top:4px; }
  .keys { text-align:center; font-size:.75rem; color:var(--ink3); }
  .keys kbd { font-family:inherit; border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:0 5px; }

  .sum-head { text-align:center; padding:24px 0 8px; }
  .sum-big { font-size:3rem; font-weight:700; line-height:1.1; font-variant-numeric:tabular-nums; }
  .sum-big span { font-size:1.2rem; color:var(--ink3); font-weight:500; margin-left:4px; }
  .sum-head p { color:var(--ink2); }
  .sum-list { list-style:none; display:flex; flex-direction:column; gap:6px; margin:12px 0 20px; }
  .sum-list li { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 14px;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; }
  .sum-list .jp { font-size:1.02rem; }

  .toast { position:fixed; left:50%; bottom:max(24px, env(safe-area-inset-bottom)); transform:translateX(-50%);
    z-index:20; background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:12px; font-size:.9rem;
    box-shadow:var(--shadow); max-width:calc(100% - 32px); }

  @media (max-width: 760px) {
    .wrap { padding:20px 16px 48px; }
    .brand h1 { font-size:2rem; }
    .side { min-width:0; width:100%; }
    .layout { grid-template-columns:minmax(0,1fr); gap:16px; }
    nav.units { position:static; flex-direction:row; overflow-x:auto; margin:0 -16px; padding:4px 16px 8px;
      scroll-snap-type:x proximity; scrollbar-width:none; }
    nav.units::-webkit-scrollbar { display:none; }
    .unit-btn { flex:0 0 auto; grid-template-columns:auto auto; gap:6px; scroll-snap-align:start;
      border:1px solid var(--line); background:var(--panel); padding:8px 12px; }
    .unit-btn .s, .unit-btn .p { display:none; }
    .review-btn { flex:0 0 auto; margin-top:0; }
    .start { align-items:stretch; width:100%; }
    .start-btns .btn { flex:1; }
    .phrase { grid-template-columns:36px minmax(0,1fr) auto; gap:10px; padding:10px 12px; }
    .phrase .mic-sm { display:none; }
    .icon-btn { width:36px; height:36px; }
    .drill-inner, #d-play { gap:14px; }
    .card { padding:24px 16px; min-height:180px; }
    .keys { display:none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .mic.on::before, .mic.on::after { animation:none; opacity:.6; }
    .bar i, .ring .val { transition:none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>はなす<b>。</b></h1>
      <p>듣고, 따라 말하고, 바로 채점받는 일본어 속성 코스</p>
    </div>
    <div class="side">
      <div class="overall">
        <div class="label"><span>통과한 문장 (80점 이상)</span><b id="overall-num"></b></div>
        <div class="bar"><i id="overall-bar"></i></div>
      </div>
      <div class="settings">
        <button class="chip" id="t-furi" aria-pressed="true">후리가나</button>
        <button class="chip" id="t-pron" aria-pressed="true">한글 발음</button>
        <label class="chip">목소리 <select id="voice" aria-label="일본어 목소리"></select></label>
      </div>
    </div>
  </header>

  <div class="banner" id="sr-banner" hidden></div>

  <div class="layout">
    <nav class="units" aria-label="단원">
      <div id="units" style="display:contents"></div>
      <button class="review-btn" id="review">약한 문장 복습 →</button>
    </nav>
    <main id="lesson"></main>
  </div>

  <footer>
    <p>가나가 아직 낯설다면 <a href="/taberu/">가나 훈련</a>부터 해 보세요.</p>
    <p>음성 인식은 브라우저 기본 기능을 써요. Chrome은 Google, Safari는 Apple 서버로 음성이 전송돼요. 진행 기록은 이 브라우저에만 저장돼요.</p>
  </footer>
</div>

<div class="drill" id="drill" hidden role="dialog" aria-modal="true" aria-labelledby="d-label">
  <div class="drill-inner">
    <div class="drill-top">
      <button class="icon-btn" id="d-close" aria-label="닫기"></button>
      <div class="lab" id="d-label"></div>
      <div class="cnt" id="d-count"></div>
    </div>
    <div class="bar"><i id="d-bar"></i></div>

    <div id="d-play">
      <div class="card">
        <div class="big-ko" id="d-ko"></div>
        <div class="big-ja" id="d-ja" lang="ja"></div>
        <div class="pr" id="d-pr"></div>
        <div class="ko" id="d-sub"></div>
        <button class="link" id="d-hint">힌트 보기</button>
      </div>
      <div class="audio-row" id="d-audio">
        <button class="btn" id="d-listen"></button>
        <button class="btn" id="d-slow"></button>
      </div>
      <div class="mic-area">
        <button class="mic" id="d-mic"></button>
        <div class="mic-cap" id="d-cap"></div>
      </div>
      <div class="heard" id="d-heard" aria-live="polite"></div>
      <div class="result" id="d-result" hidden>
        <svg class="ring" viewBox="0 0 72 72" aria-hidden="true">
          <circle class="track" cx="36" cy="36" r="30"/>
          <circle class="val" id="ring-val" cx="36" cy="36" r="30" transform="rotate(-90 36 36)"/>
          <text x="36" y="42" text-anchor="middle" id="ring-num"></text>
        </svg>
        <div class="verdict" id="d-verdict"></div>
      </div>
      <div class="drill-foot">
        <button class="btn" id="d-next"></button>
      </div>
      <div class="keys"><kbd>Space</kbd> 말하기 · <kbd>P</kbd> 듣기 · <kbd>→</kbd> 다음 · <kbd>Esc</kbd> 닫기</div>
    </div>

    <div id="d-summary" hidden></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
// ---------- 커리큘럼 ----------
// 표기법: 漢字[よみ] = 후리가나, ^は / ^へ = 조사(와/에로 발음), 띄어쓰기 = 한글 발음의 어절 구분(화면엔 안 보임)
const UNITS = [
  {
    id: 'aisatsu', title: '인사', ja: 'あいさつ', goal: '하루 종일 쓰는 인사와 정중체 ~です·~ます',
    note: `
      <p>일본어 존댓말의 뼈대는 <b>~です / ~ます</b>예요. 처음엔 이 정중체 하나만 써도 어디서든 실례가 되지 않아요.</p>
      <ul>
        <li>아침엔 <j>おはようございます</j>, 낮엔 <j>こんにち^は</j>, 해가 지면 <j>こんばん^は</j>.</li>
        <li><j>こんにち^は</j>의 끝 글자 <j>は</j>는 조사라서 <b>'와'</b>로 읽어요. 앞으로 나오는 조사 は도 전부 '와'예요.</li>
        <li><j>すみません</j>은 '죄송합니다'·'실례합니다'·'저기요'까지 되는 만능 표현이에요.</li>
        <li>식사 전엔 <j>いただきます</j>, 식사 후엔 <j>ごちそうさまでした</j>.</li>
      </ul>`,
    phrases: [
      { j: 'おはよう ございます', k: '안녕하세요 (아침 인사)' },
      { j: 'こんにち^は', k: '안녕하세요 (낮 인사)', alt: ['今日は'] },
      { j: 'こんばん^は', k: '안녕하세요 (저녁 인사)', alt: ['今晩は'] },
      { j: 'ありがとう ございます', k: '감사합니다' },
      { j: 'すみません', k: '죄송합니다 / 저기요' },
      { j: '初[はじ]めまして', k: '처음 뵙겠습니다' },
      { j: 'よろしく お願[ねが]い します', k: '잘 부탁드립니다' },
      { j: 'いただきます', k: '잘 먹겠습니다' },
      { j: 'ごちそうさま でした', k: '잘 먹었습니다' },
      { j: 'おやすみ なさい', k: '안녕히 주무세요' },
      { j: 'さようなら', k: '안녕히 가세요' },
    ],
  },
  {
    id: 'jiko', title: '자기소개', ja: '自己紹介', goal: 'A는 B입니다 — 가장 많이 쓰는 문형',
    note: `
      <p><b>A^は Bです</b> = A는 B입니다. 일본어에서 가장 많이 쓰는 문형이에요.</p>

const PASS = 80;

// ---------- 표기 파싱 ----------
const KANJI = '\\u3400-\\u4DBF\\u4E00-\\u9FFF\\uF900-\\uFAFF々〆ヶ';
const TOKEN = new RegExp(`([${KANJI}]+)\\[([^\\]]+)\\]|\\^([はへ])|( )|([^])`, 'gu');

function parse(src) {
  const segs = [];
  for (const m of src.matchAll(TOKEN)) {
    if (m[1]) segs.push({ base: m[1], read: m[2] });
    else if (m[3]) segs.push({ base: m[3], read: m[3] === 'は' ? 'わ' : 'え', particle: true });
    else if (m[4]) segs.push({ space: true });
    else segs.push({ base: m[5] });
  }
  return segs;
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function rubyHTML(segs, status) {
  return segs.map((s, i) => {
    if (s.space) return '';
    const inner = s.read && !s.particle ? `<ruby>${esc(s.base)}<rt>${esc(s.read)}</rt></ruby>` : esc(s.base);
    const st = status && status[i];
    return st ? `<span class="seg ${st}">${inner}</span>` : inner;
  }).join('');
}

const hira = c => {
  const x = c.codePointAt(0);
  return x >= 0x30A1 && x <= 0x30F6 ? String.fromCodePoint(x - 0x60) : c;
};

// ---------- 한글 발음 ----------
const H = {}, H2 = {};
(() => {
  const one = [...'あ아い이う우え에お오か카き키く쿠け케こ코が가ぎ기ぐ구げ게ご고さ사し시す스せ세そ소ざ자じ지ず즈ぜ제ぞ조' +
    'た타ち치つ츠て테と토だ다ぢ지づ즈で데ど도な나に니ぬ누ね네の노は하ひ히ふ후へ헤ほ호ば바び비ぶ부べ베ぼ보' +
    'ぱ파ぴ피ぷ푸ぺ페ぽ포ま마み미む무め메も모や야ゆ유よ요ら라り리る루れ레ろ로わ와を오ゔ부' +
    'ぁ아ぃ이ぅ우ぇ에ぉ오ゃ야ゅ유ょ요ゎ와'];
  for (let i = 0; i < one.length; i += 2) H[one[i]] = one[i + 1];
  const two = [...'きゃ캬きゅ큐きょ쿄ぎゃ갸ぎゅ규ぎょ교しゃ샤しゅ슈しょ쇼じゃ자じゅ주じょ조ちゃ차ちゅ추ちょ초' +
    'にゃ냐にゅ뉴にょ뇨ひゃ햐ひゅ휴ひょ효びゃ뱌びゅ뷰びょ뵤ぴゃ퍄ぴゅ퓨ぴょ표みゃ먀みゅ뮤みょ묘りゃ랴りゅ류りょ료' +
    'ふぁ화ふぃ피ふぇ페ふぉ포てぃ티でぃ디とぅ투どぅ두うぃ위うぇ웨うぉ워ちぇ체しぇ셰じぇ제つぁ차ゔぁ바'];
  for (let i = 0; i < two.length; i += 3) H2[two[i] + two[i + 1]] = two[i + 2];
})();

const SYL0 = 0xAC00;
const lastSyl = s => { const x = s.charCodeAt(s.length - 1) - SYL0; return x >= 0 && x < 11172 ? x : -1; };
// 받침 없는 마지막 음절에 받침(ㄴ=4, ㅅ=19)을 붙인다
const addFinal = (s, t) => { const x = lastSyl(s); return x >= 0 && x % 28 === 0 ? s.slice(0, -1) + String.fromCharCode(SYL0 + x + t) : s; };
const vowelOf = s => { const x = lastSyl(s); return x >= 0 && x % 28 === 0 ? Math.floor(x / 28) % 21 : -1; };
const V_OU = [8, 12, 13, 17, 18], V_E = [5, 7]; // ㅗㅛㅜㅠㅡ / ㅔㅖ
const PUNCT = { '、': ', ', '。': ' ', '？': '? ', '！': '! ', '?': '? ', '!': '! ' };

function toHangul(segs) {
  const units = [];
  for (const s of segs) {
    if (s.space) { units.push(null); continue; }
    const ruby = !!s.read && !s.particle;
    for (const c of s.read || s.base) units.push({ c: hira(c), ruby, kata: c !== hira(c) || c === 'ー' });
  }
  let out = '', prev = null;
  for (let i = 0; i < units.length; i++) {
    const u = units[i];
    if (!u) { out += ' '; prev = null; continue; }
    const nx = units[i + 1];
    if (nx && H2[u.c + nx.c]) { out += H2[u.c + nx.c]; prev = nx; i++; continue; }
    if (PUNCT[u.c]) { out += PUNCT[u.c]; prev = null; continue; }
    if (u.c === 'っ') out = addFinal(out, 19);
    else if (u.c === 'ん') out = addFinal(out, 4);
    else if (u.c === 'ー') out += '-';
    // 장음: おう·うう는 길게, えい는 한자 읽기 안에서만 길게 (している의 てい는 제외)
    else if (u.c === 'う' && prev && !prev.kata && !u.kata && prev.ruby === u.ruby && V_OU.includes(vowelOf(out))) out += '-';
    else if (u.c === 'い' && prev && prev.ruby && u.ruby && V_E.includes(vowelOf(out))) out += '-';
    else out += H[u.c] || u.c;
    prev = u;
  }
  return out.replace(/\s+/g, ' ').trim();
}

// ---------- 채점 ----------
// ASR은 같은 말을 한자/가나/숫자로 제각각 적으므로 양쪽을 같은 모양으로 맞춘 뒤 비교한다
const VARIANTS = [
  ['下さい', 'ください'], ['有難う', 'ありがとう'], ['御座います', 'ございます'], ['宜しく', 'よろしく'],
  ['頂きます', 'いただきます'], ['ご馳走様', 'ごちそうさま'], ['ご馳走さま', 'ごちそうさま'], ['お休みなさい', 'おやすみなさい'],
  ['お勧め', 'おすすめ'], ['お薦め', 'おすすめ'], ['真っ直ぐ', 'まっすぐ'], ['真っすぐ', 'まっすぐ'],
  ['出来', 'でき'], ['分り', 'わかり'], ['無くし', 'なくし'], ['失くし', 'なくし'], ['綺麗', 'きれい'],
];
const KANJI_NUM = '〇一二三四五六七八九';

function norm(s) {
  s = s.normalize('NFKC').toLowerCase();
  for (const [a, b] of VARIANTS) s = s.split(a).join(b);
  return [...s].map(c => {
    const n = KANJI_NUM.indexOf(c);
    return n >= 0 ? String(n) : hira(c);
  }).join('').replace(/[^\p{L}\p{N}ー]/gu, '');
}

// 문장을 "한자 표기 또는 읽기" 중 아무 길로나 지나갈 수 있는 그래프로 만든다
function buildGraph(segs) {
  const edges = [];
  let cur = 0, n = 1, minLen = 0;
  segs.forEach((s, seg) => {
    if (s.space) return;
    const opts = [...new Set([s.base, s.read].filter(Boolean).map(norm))].filter(Boolean);
    if (!opts.length) return;
    minLen += Math.min(...opts.map(o => [...o].length));
    const tails = [];
    for (const o of opts) {
      const chars = [...o];
      let u = cur;
      chars.forEach((ch, i) => {
        if (i === chars.length - 1) tails.push({ u, ch, seg });
        else { edges.push({ u, v: n, ch, seg }); u = n++; }
      });
    }
    tails.forEach(t => edges.push({ ...t, v: n }));
    cur = n++;
  });
  const inc = Array.from({ length: n }, () => []);
  edges.forEach(e => inc[e.v].push(e));
  return { inc, n, final: cur, minLen, nsegs: segs.length };
}

// 그래프 위 편집 거리. 어느 덩어리를 틀렸는지 역추적해서 돌려준다
function align(g, heard) {
  const a = [...heard], m = a.length;
  const D = [], B = [];
  for (let i = 0; i <= m; i++) {
    D.push(new Float64Array(g.n).fill(Infinity));
    B.push(new Array(g.n).fill(null));
    for (let v = 0; v < g.n; v++) {
      if (i === 0 && v === 0) { D[0][0] = 0; continue; }
      let best = Infinity, bp = null;
      for (const e of g.inc[v]) {
        if (i > 0) {
          const hit = a[i - 1] === e.ch, c = D[i - 1][e.u] + (hit ? 0 : 1);
          if (c < best) { best = c; bp = { i: i - 1, v: e.u, op: hit ? 'ok' : 'sub', e }; }
        }
        if (D[i][e.u] + 1 < best) { best = D[i][e.u] + 1; bp = { i, v: e.u, op: 'del', e }; }
      }
      if (i > 0 && D[i - 1][v] + 1 < best) { best = D[i - 1][v] + 1; bp = { i: i - 1, v, op: 'ins' }; }
      D[i][v] = best; B[i][v] = bp;
    }
  }
  const status = new Array(g.nsegs).fill(null);
  for (let i = m, v = g.final, bp; (bp = B[i][v]); i = bp.i, v = bp.v) {
    if (bp.e) status[bp.e.seg] = status[bp.e.seg] === 'bad' || bp.op !== 'ok' ? 'bad' : 'ok';
  }
  const score = Math.max(0, 1 - D[m][g.final] / Math.max(g.minLen, m, 1));
  return { score, status };
}

function grade(p, transcripts) {
  let best = { score: -1 };
  for (const t of transcripts) {
    const h = norm(t), main = align(p.graph, h);
    if (main.score > best.score) best = { score: main.score, status: main.status, heard: t };
    for (const g of p.altGraphs) {
      const r = align(g, h);
      if (r.score > best.score) {
        best = { score: r.score, heard: t, status: r.score * 100 >= PASS ? main.status.map(s => s && 'ok') : main.status };
      }
    }
  }
  return best;
}

UNITS.forEach((u, ui) => u.phrases.forEach((p, pi) => {
  Object.assign(p, { id: `${u.id}.${pi}`, ui, pi, segs: parse(p.j) });
  p.text = p.segs.map(s => (s.space ? '' : s.base)).join('');
  p.pron = toHangul(p.segs);
  p.graph = buildGraph(p.segs);
  p.altGraphs = (p.alt || []).map(a => buildGraph(parse(a)));
}));
const ALL = UNITS.flatMap(u => u.phrases);

// ---------- UI ----------
const $ = s => document.querySelector(s);
const ICON = {
  play: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.6v12.8a1 1 0 0 0 1.5.86l10.2-6.4a1 1 0 0 0 0-1.72L9.5 4.74A1 1 0 0 0 8 5.6z"/></svg>',

};

const store = (() => {
  const KEY = 'hanasu.v1';
  let data = {};
  try { data = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
  data.best = data.best || {};
  data.prefs = { furi: true, pron: true, unit: 0, ...data.prefs };
  return { data, save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} } };
})();
const prefs = store.data.prefs;
const best = p => store.data.best[p.id];
const passed = p => (best(p) ?? -1) >= PASS;
const badge = b => (b == null ? '<span class="badge">–</span>' : `<span class="badge ${b >= PASS ? 'pass' : 'fail'}">${b}</span>`);
const pad = n => String(n).padStart(2, '0');

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
}

// ----- TTS -----
let voices = [];
function pickVoice() {
  return voices.find(v => v.name === prefs.voice)
    || voices.find(v => /google|kyoko|o-ren|nanami|haruka/i.test(v.name))
    || voices[0];
}
function loadVoices() {
  voices = speechSynthesis.getVoices().filter(v => /^ja/i.test(v.lang));
  const sel = $('#voice');
  sel.innerHTML = voices.length
    ? voices.map(v => `<option>${esc(v.name)}</option>`).join('')
    : '<option>일본어 음성 없음</option>';
  sel.disabled = !voices.length;
  const v = pickVoice();
  if (v) sel.value = v.name;
}
function speak(text, { slow = false, btn = null } = {}) {
  if (!('speechSynthesis' in window)) return toast('이 브라우저는 음성 재생을 지원하지 않아요.');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  u.rate = slow ? 0.6 : 0.95;
  const v = pickVoice();
  if (v) u.voice = v;
  if (btn) {
    btn.classList.add('playing');
    u.onend = u.onerror = () => btn.classList.remove('playing');
  }
  speechSynthesis.speak(u);
}

// ----- ASR -----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const SR_ERR = {
  'not-allowed': '마이크 권한이 막혀 있어요. 주소창 옆 자물쇠 아이콘에서 마이크를 허용해 주세요.',
  'service-not-allowed': '음성 인식 서비스를 쓸 수 없어요. Safari라면 설정 › Siri에서 받아쓰기를 켜 주세요.',
  'no-speech': '말소리가 들리지 않았어요. 마이크를 누르고 바로 말해 보세요.',
  'audio-capture': '마이크를 찾지 못했어요.',
  'network': '음성 인식 서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.',
  'language-not-supported': '이 브라우저는 일본어 음성 인식을 지원하지 않아요.',
};
let rec = null;
function listen({ onInterim, onDone }) {
  speechSynthesis.cancel();
  const r = new SR();
  r.lang = 'ja-JP';
  r.interimResults = true;
  r.maxAlternatives = 5;
  r.continuous = false;
  let finals = null, latest = '', error = null;
  r.onresult = e => {
    const res = Array.from(e.results);
    latest = res.map(x => x[0].transcript).join('');
    onInterim(latest);
    if (res.every(x => x.isFinal)) finals = res.length === 1 ? Array.from(res[0], a => a.transcript) : [latest];
  };
  r.onerror = e => { error = e.error; };
  // Safari는 final 없이 끝나기도 해서 마지막 중간 결과라도 채점한다
  r.onend = () => {
    if (rec === r) rec = null;
    onDone({ transcripts: (finals || (latest ? [latest] : [])).filter(t => t.trim()), error });
  };
  try { r.start(); rec = r; } catch (e) { onDone({ transcripts: [], error: 'start' }); }
}

        <div class="eyebrow">UNIT ${pad(cur + 1)} · <span class="jp">${esc(u.ja)}</span></div>
        <h2>${esc(u.title)}</h2>
        <p class="goal">${esc(u.goal)}</p>
      </div>
      <div class="start">
        <div class="start-btns">
          <button class="btn primary" data-start="shadow">${ICON.mic} 따라 말하기</button>
          <button class="btn" data-start="speak">보고 말하기</button>
        </div>
        <div class="start-hint">따라 말하기: 보고 듣고 읽기 · 보고 말하기: 뜻만 보고 일본어로</div>
      </div>
    </div>
    <details class="note"${noteOpen ? ' open' : ''}><summary>핵심 문법</summary><div class="note-body">${noteHTML(u.note)}</div></details>
    <ol class="phrases">${u.phrases.map(phraseRow).join('')}</ol>`;
}

function selectUnit(ui) {
  cur = ui;
  prefs.unit = ui;
  store.save();
  renderNav();
  renderLesson();
  $('.layout').scrollIntoView({ block: 'start', behavior: 'smooth' });
}

// ----- 연습 -----
const drill = { items: [], i: 0, mode: 'shadow', title: '', unit: null, results: [], state: 'idle', hinted: false, token: 0 };
const item = () => drill.items[drill.i];
const answerShown = () => drill.mode === 'shadow' || drill.state === 'graded';

function openDrill({ items, mode, title, unit = null }) {
  Object.assign(drill, { items, mode, title, unit, i: 0, results: items.map(() => null) });
  drill.token++;
  $('#drill').hidden = false;
  $('#drill').scrollTop = 0;
  document.body.classList.add('drilling');
  renderCard();
}

function closeDrill() {
  drill.token++;
  rec?.abort();
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  $('#drill').hidden = true;
  document.body.classList.remove('drilling');
  renderNav();
  renderLesson();
}

function paintAnswer(status) {
  const p = item(), show = answerShown();
  $('#d-ko').hidden = drill.mode !== 'speak';
  $('#d-ko').textContent = p.k;
  $('#d-ja').hidden = !show;
  $('#d-ja').innerHTML = show ? rubyHTML(p.segs, status) : '';
  $('#d-pr').hidden = !((show && prefs.pron) || drill.hinted);
  $('#d-pr').textContent = p.pron;
  $('#d-sub').hidden = drill.mode === 'speak';
  $('#d-sub').textContent = p.k;
  $('#d-hint').hidden = show || drill.hinted;
  $('#d-audio').hidden = !show && !drill.hinted;
}

function setMic(on) {
  const m = $('#d-mic');
  m.classList.toggle('on', on);
  m.innerHTML = on ? ICON.stop : ICON.mic;
  m.disabled = !SR;
  m.setAttribute('aria-label', on ? '그만 듣기' : '말하기');
  $('#d-cap').textContent = !SR ? '이 브라우저에선 음성 인식을 쓸 수 없어요'
    : on ? '듣고 있어요. 말이 끝나면 자동으로 채점해요'
    : drill.state === 'graded' ? '다시 말하려면 누르세요' : '누르고 일본어로 말해 보세요';
}

function setNext(graded) {
  const last = drill.i === drill.items.length - 1, b = $('#d-next');
  b.textContent = graded ? (last ? '결과 보기' : '다음 →') : (last ? '건너뛰고 결과 보기' : '건너뛰기');
  b.classList.toggle('primary', graded);
}

function renderCard() {
  drill.state = 'idle';
  drill.hinted = false;
  $('#d-label').textContent = drill.title;
  $('#d-count').textContent = `${drill.i + 1} / ${drill.items.length}`;
  $('#d-bar').style.width = `${(drill.i / drill.items.length) * 100}%`;
  $('#d-play').hidden = false;
  $('#d-summary').hidden = true;
  $('#d-heard').className = 'heard';
  $('#d-heard').textContent = '';
  $('#d-result').hidden = true;
  paintAnswer(null);
  setMic(false);
  setNext(false);
  if (drill.mode === 'shadow') speak(item().text, { btn: $('#d-listen') });
}

function onMic() {
  if (!SR) return;
  if (drill.state === 'listening') { rec?.stop(); return; }
  const p = item(), prevState = drill.state, token = ++drill.token, heard = $('#d-heard');
  drill.state = 'listening';
  setMic(true);
  heard.className = 'heard';
  heard.textContent = '';
  listen({
    onInterim: t => { if (token === drill.token) heard.textContent = t; },
    onDone: ({ transcripts, error }) => {
      if (token !== drill.token) return;
      if (!transcripts.length) {
        drill.state = prevState;
        setMic(false);
        heard.className = 'heard err';
        heard.textContent = SR_ERR[error] || SR_ERR['no-speech'];
        return;
      }
      showGrade(p, grade(p, transcripts));
    },
  });
}

const VERDICT = [
  [90, '완벽해요!', '원어민도 알아듣는 발음이에요'],
  [PASS, '통과!', '좋아요, 다음 문장으로 가요'],
  [60, '거의 다 왔어요', '빨간 부분을 다시 듣고 말해 보세요'],
  [0, '다시 한 번!', '듣기를 누르고 천천히 따라 해 보세요'],
];

function showGrade(p, r) {
  const score = Math.round(r.score * 100);
  drill.state = 'graded';
  setMic(false);
  drill.results[drill.i] = Math.max(drill.results[drill.i] ?? 0, score);
  if (score > (best(p) ?? -1)) { store.data.best[p.id] = score; store.save(); }
  paintAnswer(r.status);
  $('#d-heard').className = 'heard';
  $('#d-heard').innerHTML = `<span class="lab">들은 말</span>${esc(r.heard)}`;
  const C = 2 * Math.PI * 30, ring = $('#ring-val');
  ring.style.stroke = score >= PASS ? 'var(--ok)' : score >= 60 ? 'var(--mid)' : 'var(--bad)';
  ring.style.strokeDasharray = C;
  ring.style.strokeDashoffset = C;
  $('#ring-num').textContent = score;
  const [, title, sub] = VERDICT.find(([min]) => score >= min);
  $('#d-verdict').innerHTML = `<b>${title}</b><small>${sub}</small>`;
  $('#d-result').hidden = false;
  requestAnimationFrame(() => requestAnimationFrame(() => { ring.style.strokeDashoffset = C * (1 - score / 100); }));
  setNext(true);
}

function next() {
  if (drill.state === 'listening') { drill.token++; rec?.abort(); }
  if (drill.i < drill.items.length - 1) { drill.i++; renderCard(); } else showSummary();
}

function showSummary() {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  const res = drill.results, tried = res.filter(x => x != null);
  const avg = tried.length ? Math.round(tried.reduce((a, b) => a + b, 0) / tried.length) : 0;
  const pass = tried.filter(x => x >= PASS).length;
  drill.weak = drill.items.filter((_, i) => (res[i] ?? -1) < PASS);
  const hasNext = drill.unit != null && drill.unit < UNITS.length - 1;
  $('#d-bar').style.width = '100%';
  $('#d-count').textContent = `${drill.items.length} / ${drill.items.length}`;
  $('#d-play').hidden = true;
  const s = $('#d-summary');
  s.hidden = false;
  s.innerHTML = `
    <div class="sum-head">
      <div class="sum-big">${pass}<span>/ ${drill.items.length}</span></div>
      <p>통과 · 평균 ${avg}점${tried.length < drill.items.length ? ` · ${drill.items.length - tried.length}문장 건너뜀` : ''}</p>
    </div>
    <ol class="sum-list">${drill.items.map((p, i) => `<li><span class="jp" lang="ja">${esc(p.text)}</span>${badge(res[i])}</li>`).join('')}</ol>
    <div class="drill-foot">
      ${drill.weak.length ? `<button class="btn primary" data-sum="weak">통과 못 한 ${drill.weak.length}문장 다시</button>` : ''}
      ${hasNext ? `<button class="btn${drill.weak.length ? '' : ' primary'}" data-sum="next">다음 단원 →</button>` : ''}
      <button class="btn" data-sum="close">닫기</button>
    </div>`;
}

function startReview() {
  const tried = ALL.filter(p => best(p) != null).sort((a, b) => best(a) - best(b)).slice(0, 10);
  if (!tried.length) return toast('아직 연습한 문장이 없어요. 단원부터 시작해 보세요.');
  for (let i = tried.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [tried[i], tried[j]] = [tried[j], tried[i]];
  }
  openDrill({ items: tried, mode: 'shadow', title: '약한 문장 복습' });
}

// ----- 이벤트 -----
$('#units').addEventListener('click', e => {
  const b = e.target.closest('[data-ui]');
  if (b) selectUnit(+b.dataset.ui);
});
$('#review').addEventListener('click', startReview);

$('#lesson').addEventListener('click', e => {
  const u = UNITS[cur], start = e.target.closest('[data-start]');
  if (start) {
    const mode = start.dataset.start;
    return openDrill({ items: u.phrases, mode, unit: cur, title: `${u.title} · ${mode === 'shadow' ? '따라 말하기' : '보고 말하기'}` });
  }
  const row = e.target.closest('.phrase');
  if (!row) return;
  const p = u.phrases[+row.dataset.pi];
  if (e.target.closest('[data-play]')) speak(p.text, { btn: e.target.closest('[data-play]') });
  else if (e.target.closest('[data-open]')) {
    openDrill({ items: u.phrases.slice(p.pi), mode: 'shadow', unit: cur, title: `${u.title} · 따라 말하기` });
  }
});
$('#lesson').addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.txt')) { e.preventDefault(); e.target.click(); }
});

$('#d-close').addEventListener('click', closeDrill);
$('#d-mic').addEventListener('click', onMic);
$('#d-next').addEventListener('click', next);
$('#d-listen').addEventListener('click', e => speak(item().text, { btn: e.currentTarget }));
$('#d-slow').addEventListener('click', e => speak(item().text, { slow: true, btn: e.currentTarget }));
$('#d-hint').addEventListener('click', () => { drill.hinted = true; paintAnswer(null); });
$('#d-summary').addEventListener('click', e => {
  const act = e.target.closest('[data-sum]')?.dataset.sum;
  if (act === 'weak') openDrill({ items: drill.weak, mode: drill.mode, unit: drill.unit, title: `${drill.title.replace(/ · 다시$/, '')} · 다시` });
  else if (act === 'next') { const ui = drill.unit + 1; closeDrill(); selectUnit(ui); }
  else if (act === 'close') closeDrill();
});

document.addEventListener('keydown', e => {
  if ($('#drill').hidden) return;
  if (e.key === 'Escape') return closeDrill();
  if (!$('#d-summary').hidden || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.code === 'Space') {
    e.preventDefault();
    if (e.repeat) return;
    document.activeElement?.blur?.();
    onMic();
  } else if (e.key === 'ArrowRight' || (e.key === 'Enter' && drill.state === 'graded' && !(e.target instanceof HTMLButtonElement))) {
    next();
  } else if (e.key.toLowerCase() === 'p' && (answerShown() || drill.hinted)) {
    speak(item().text, { btn: $('#d-listen') });
  }
});

function applyPrefs() {
  document.body.classList.toggle('no-furi', !prefs.furi);
  document.body.classList.toggle('no-pron', !prefs.pron);
  $('#t-furi').setAttribute('aria-pressed', prefs.furi);
  $('#t-pron').setAttribute('aria-pressed', prefs.pron);
}
$('#t-furi').addEventListener('click', () => { prefs.furi = !prefs.furi; store.save(); applyPrefs(); });
$('#t-pron').addEventListener('click', () => {
  prefs.pron = !prefs.pron;
  store.save();
  applyPrefs();
  if (!$('#drill').hidden && !$('#d-play').hidden) paintAnswer(null);
});
$('#voice').addEventListener('change', e => { prefs.voice = e.target.value; store.save(); });

// ----- 시작 -----
$('#d-close').innerHTML = ICON.close;
$('#d-listen').innerHTML = `${ICON.play} 듣기`;
$('#d-slow').innerHTML = `${ICON.play} 천천히`;
if (!SR || !window.isSecureContext) {
  const b = $('#sr-banner');
  b.hidden = false;
  b.textContent = !window.isSecureContext
    ? '마이크는 https 주소에서만 쓸 수 있어요. 듣기와 읽기는 그대로 쓸 수 있어요.'
    : '이 브라우저는 음성 인식을 지원하지 않아요. Chrome · Edge · Safari에서 열어 주세요. 듣기와 읽기는 그대로 쓸 수 있어요.';
}
if ('speechSynthesis' in window) {
  loadVoices();
  speechSynthesis.addEventListener?.('voiceschanged', loadVoices);
} else {
  $('#voice').closest('.chip').hidden = true;
}
applyPrefs();
renderNav();
renderLesson();
</script>
</body>
</html>
