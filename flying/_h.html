<!DOCTYPE html><html><head><style>html,body{margin:0}iframe{border:0;width:100vw;height:100vh;display:block}</style></head>
<body><iframe id="f" src="index.html"></iframe>
<script>
var p=new URLSearchParams(location.search);
document.getElementById('f').addEventListener('load',function(){
  var w=this.contentWindow,d=this.contentDocument;
  setTimeout(function(){
    if(p.get('theme'))d.documentElement.dataset.theme=p.get('theme');
    var go=function(el){if(el)el.dispatchEvent(new w.Event('click',{bubbles:true}));};
    if(p.get('tab'))go(d.querySelector('.tab[data-tab="'+p.get('tab')+'"]'));
    if(p.get('sort'))go(d.querySelector('#sort-air [data-sort="'+p.get('sort')+'"]'));
    if(p.get('filter'))go(d.querySelector('#filt-air [data-filter="'+p.get('filter')+'"]'));
    if(p.get('acfilter'))go(d.querySelector('#filt-ac [data-filter="'+p.get('acfilter')+'"]'));
    setTimeout(function(){ if(p.get('card'))go(d.querySelector('[data-id="'+p.get('card')+'"]')); },250);
  },1500);
});
</script></body></html>
