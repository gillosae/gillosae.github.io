<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Flying</title>
<!-- Google Analytics (GA4) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2S4N123Q9E"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#fbfbfc; --panel:#f1f1f4; --line:#e6e6ea; --ink:#15151a; --ink2:#6a6a76; --ink3:#9b9ba6;
    --accent:#2b6ef6; --tile-edge:rgba(0,0,0,.07); --shadow:0 6px 20px rgba(18,18,28,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b0b0e; --panel:#191920; --line:#25252d; --ink:#f2f2f5; --ink2:#9a9aa6; --ink3:#6b6b76;
            --accent:#6f9dff; --tile-edge:rgba(255,255,255,.10); --shadow:0 6px 24px rgba(0,0,0,.5); }
  }
  :root[data-theme="light"] { --bg:#fbfbfc; --panel:#f1f1f4; --line:#e6e6ea; --ink:#15151a; --ink2:#6a6a76;
    --ink3:#9b9ba6; --accent:#2b6ef6; --tile-edge:rgba(0,0,0,.07); --shadow:0 6px 20px rgba(18,18,28,.10); }
  :root[data-theme="dark"] { --bg:#0b0b0e; --panel:#191920; --line:#25252d; --ink:#f2f2f5; --ink2:#9a9aa6;
    --ink3:#6b6b76; --accent:#6f9dff; --tile-edge:rgba(255,255,255,.10); --shadow:0 6px 24px rgba(0,0,0,.5); }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Noto Sans KR','Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; padding-bottom: 72px;
  }
  button, input { font: inherit; color: inherit; }
  .n { font-family:'Inter',sans-serif; font-variant-numeric: tabular-nums; }
  .wrap { max-width: 940px; margin: 0 auto; padding: 0 20px; }

  /* header + hero */
  header { text-align: center; padding: 52px 0 0; }
  h1 { margin: 0; font-family:'Inter',sans-serif; font-size: 1.4rem; font-weight: 800; letter-spacing: -.03em; }
  .home { display: inline-block; margin-top: 10px; font-size: .72rem; color: var(--ink3); text-decoration: none; letter-spacing: .06em; }
  .home:hover { color: var(--ink); }

  .hero { text-align: center; margin: 34px 0 30px; }
  .hero-num { font-family:'Inter',sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -.045em; line-height: 1; }
  .hero-num b { font-size: 3.1rem; font-weight: 800; }
  .hero-num span { font-size: 1.15rem; font-weight: 600; color: var(--ink3); margin-left: 4px; }
  .track { width: min(320px, 78%); height: 4px; margin: 18px auto 0; border-radius: 99px; background: var(--panel); overflow: hidden; }
  .track i { display: block; height: 100%; border-radius: 99px; background: var(--accent);
             transform-origin: left; animation: g .8s cubic-bezier(.16,1,.3,1) both; }
  @keyframes g { from { transform: scaleX(0); } }
  .hero-sub { margin-top: 14px; font-size: .74rem; color: var(--ink3); letter-spacing: .01em; }
  .hero-sub b { font-family:'Inter',sans-serif; font-weight: 700; color: var(--ink2); font-variant-numeric: tabular-nums; }

  /* tabs */
  .tabs { position: sticky; top: 0; z-index: 20; display: flex; justify-content: center;
          padding: 12px 0; background: var(--bg); }
  .tabs-in { display: inline-flex; gap: 2px; padding: 3px; border-radius: 99px; background: var(--panel); }
  .tab { border: 0; background: none; cursor: pointer; border-radius: 99px; padding: 7px 19px;
         font-size: .79rem; font-weight: 700; color: var(--ink3); letter-spacing: -.01em; transition: .16s; }
  .tab:hover { color: var(--ink2); }
  .tab.active { background: var(--bg); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.10); }
  @media (prefers-color-scheme: dark) { .tab.active { background: #32323d; } }
  :root[data-theme="dark"] .tab.active { background: #32323d; }
  .panel { display: none; }
  .panel.active { display: block; }

  /* controls */
  .bar { margin: 14px 0 26px; }
  .find { position: relative; }
  .find svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px;
              fill: none; stroke: var(--ink3); stroke-width: 2; }
  .find input { width: 100%; padding: 11px 15px 11px 38px; border-radius: 13px; border: 1px solid var(--line);
                background: var(--bg); font-size: .85rem; transition: .16s; }
  .find input::placeholder { color: var(--ink3); }
  .find input:focus { outline: none; border-color: var(--accent); }
  .find input::-webkit-search-cancel-button { filter: grayscale(1) opacity(.45); }

  .opts { display: flex; flex-wrap: wrap; gap: 14px 20px; align-items: center; justify-content: space-between; margin-top: 13px; }
  .set { display: inline-flex; flex-wrap: wrap; gap: 3px; }
  .opt { border: 0; background: none; cursor: pointer; padding: 5px 11px; border-radius: 99px;
         font-size: .745rem; font-weight: 600; color: var(--ink3); white-space: nowrap; transition: .16s; }
  .opt:hover { color: var(--ink); }
  .opt.on { background: var(--ink); color: var(--bg); }

  /* tile grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 24px 14px; }
  .cell { position: relative; background: none; border: 0; padding: 0; cursor: pointer;
          display: flex; flex-direction: column; align-items: center; gap: 9px; font: inherit; color: inherit; text-align: center; }
  .tile {
    position: relative; width: 56px; height: 56px; border-radius: 15px; overflow: hidden;
    box-shadow: inset 0 0 0 1px var(--tile-edge);
    transition: transform .18s cubic-bezier(.16,1,.3,1), box-shadow .18s;
  }
  .tile img { width: 56px; height: 56px; object-fit: cover; display: block; }
  .tile .mg { width: 56px; height: 56px; display: grid; place-items: center; color: #fff;
              font-family:'Inter',sans-serif; font-size: .82rem; font-weight: 800; letter-spacing: -.02em; }
  .cell:hover .tile { transform: translateY(-3px) scale(1.04); box-shadow: inset 0 0 0 1px var(--tile-edge), var(--shadow); }
  .cell.off .tile img, .cell.off .tile .mg { filter: grayscale(1); opacity: .5; }
  @media (prefers-color-scheme: dark) { .cell.off .tile img { filter: grayscale(1) brightness(1.45); opacity: .42; } }
  :root[data-theme="dark"] .cell.off .tile img { filter: grayscale(1) brightness(1.45); opacity: .42; }

  .name { font-size: .68rem; font-weight: 600; line-height: 1.34; letter-spacing: -.015em;
          height: 2.68em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .cell.off .name { color: var(--ink3); font-weight: 500; }

  .cnt { position: absolute; top: -4px; right: -4px; min-width: 17px; height: 17px; padding: 0 4px;
         border-radius: 99px; background: var(--accent); color: #fff; font-family:'Inter',sans-serif;
         font-size: .61rem; font-weight: 800; display: grid; place-items: center;
         box-shadow: 0 0 0 2.5px var(--bg); }

  /* groups */
  .grp { margin-top: 30px; }
  .grp:first-child { margin-top: 0; }
  .grp-h { display: flex; align-items: baseline; gap: 8px; margin: 0 0 15px; padding-bottom: 9px; border-bottom: 1px solid var(--line); }
  .grp-h .t { font-size: .8rem; font-weight: 700; letter-spacing: -.01em; }
  .grp-h .f { font-size: 1rem; line-height: 1; }
  .grp-h .c { margin-left: auto; font-family:'Inter',sans-serif; font-size: .7rem; font-weight: 600; color: var(--ink3); font-variant-numeric: tabular-nums; }

  /* airport rows */
  .rows { display: flex; flex-direction: column; gap: 5px; }
  .row { display: flex; align-items: center; gap: 13px; border: 1px solid var(--line); border-radius: 13px;
         padding: 11px 15px; cursor: pointer; background: none; width: 100%; text-align: left; transition: .16s; }
  .row:hover { border-color: var(--ink3); }
  .row .code { font-family:'Inter',sans-serif; font-size: .76rem; font-weight: 800; color: var(--accent); width: 2.5rem; flex-shrink: 0; }
  .row .an { flex: 1; font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .an i { color: var(--ink3); font-style: normal; }
  .row .rc { font-family:'Inter',sans-serif; font-size: .72rem; font-weight: 700; color: var(--ink3); flex-shrink: 0; }

  .none { text-align: center; padding: 58px 20px; color: var(--ink3); }
  .none span { font-size: 1.7rem; opacity: .45; display: block; margin-bottom: 12px; }
  .none p { margin: 0; font-size: .82rem; line-height: 1.65; }
  .none code { font-size: .78em; background: var(--panel); border-radius: 5px; padding: 1px 5px; }

  /* sheet */
  .ov { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
        padding: 18px; background: rgba(8,8,12,.5); backdrop-filter: blur(5px);
        opacity: 0; visibility: hidden; transition: opacity .2s; }
  .ov.open { opacity: 1; visibility: visible; }
  .sheet { position: relative; width: 100%; max-width: 440px; max-height: 86vh; overflow: hidden auto;
           background: var(--bg); border-radius: 24px; box-shadow: 0 30px 70px rgba(0,0,0,.35);
           transform: translateY(12px) scale(.985); transition: transform .24s cubic-bezier(.16,1,.3,1); padding: 26px 24px 24px; }
  .ov.open .sheet { transform: none; }
  .x { position: absolute; top: 16px; right: 16px; width: 29px; height: 29px; border-radius: 50%; border: 0;
       background: var(--panel); color: var(--ink2); font-size: .95rem; cursor: pointer; display: grid; place-items: center; }
  .x:hover { color: var(--ink); }
  .sh-h { display: flex; gap: 15px; align-items: center; padding-right: 32px; }
  .tile.big, .tile.big img, .tile.big .mg { width: 62px; height: 62px; }
  .tile.big { border-radius: 17px; }
  .tile.big .mg { font-size: .95rem; }
  .sh-h h2 { margin: 0; font-size: 1.1rem; font-weight: 700; letter-spacing: -.025em; line-height: 1.25; }
  .sh-h p { margin: 3px 0 0; font-size: .78rem; color: var(--ink2); }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 16px; }
  .tags b { font-size: .67rem; font-weight: 600; color: var(--ink2); background: var(--panel); border-radius: 99px; padding: 4px 10px; }
  .lbl { font-size: .67rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink3); margin: 22px 0 10px; }
  .fl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
  .fl li { background: var(--panel); border-radius: 14px; padding: 12px 14px; }
  .fl .d { font-family:'Inter',sans-serif; font-size: .68rem; font-weight: 600; color: var(--ink3); }
  .fl .r { font-family:'Inter',sans-serif; font-size: 1rem; font-weight: 700; letter-spacing: -.015em; margin-top: 3px; }
  .fl .r i { color: var(--ink3); font-style: normal; font-weight: 500; margin: 0 5px; }
  .fl .m { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
  .fl .m span { font-size: .655rem; font-weight: 600; color: var(--ink2); background: var(--bg); border-radius: 7px; padding: 3px 8px; }
  .fl .nt { font-size: .755rem; color: var(--ink2); margin-top: 9px; }

  @media (max-width: 600px) {
    body { font-size: 14px; }
    .wrap { padding: 0 16px; }
    header { padding: 36px 0 0; }
    .hero { margin: 26px 0 22px; }
    .hero-num b { font-size: 2.5rem; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 20px 10px; }
    .tile, .tile img, .tile .mg { width: 50px; height: 50px; }
    .tile { border-radius: 14px; }
    .sheet { padding: 22px 18px 20px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>✈︎ Flying</h1><br>
      <a class="home" href="/">.. home</a>
      <div class="hero" id="hero"></div>
    </header>

    <div class="tabs">
      <div class="tabs-in">
        <button class="tab active" data-tab="air">항공사</button>
        <button class="tab" data-tab="ac">기종</button>
        <button class="tab" data-tab="ap">공항</button>
      </div>
    </div>

    <section id="tab-air" class="panel active">
      <div class="bar">
        <div class="find">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input type="search" id="q-air" placeholder="항공사 검색">
        </div>
        <div class="opts">
          <div class="set" id="sort-air">
            <button class="opt on" data-sort="alpha">알파벳순</button>
            <button class="opt" data-sort="country">국적별</button>
            <button class="opt" data-sort="destinations">취항지순</button>
            <button class="opt" data-sort="passengers">탑승객순</button>
          </div>
          <div class="set" id="filt-air">
            <button class="opt on" data-filter="all">전체</button>
            <button class="opt" data-filter="flown">탄 것</button>
            <button class="opt" data-filter="not">안 탄 것</button>
          </div>
        </div>
      </div>
      <div id="g-air" class="grid"></div>
    </section>

    <section id="tab-ac" class="panel">
      <div class="bar">
        <div class="find">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input type="search" id="q-ac" placeholder="기종 검색">
        </div>
        <div class="opts">
          <div class="set" id="filt-ac">
            <button class="opt on" data-filter="all">전체</button>
            <button class="opt" data-filter="flown">탄 것</button>
            <button class="opt" data-filter="not">안 탄 것</button>
          </div>
        </div>
      </div>
      <div id="g-ac"></div>
    </section>

    <section id="tab-ap" class="panel"><div id="g-ap"></div></section>
  </div>

  <div class="ov" id="ov">
    <div class="sheet">
      <button class="x" id="x" aria-label="닫기">&times;</button>
      <div id="sh"></div>
    </div>
  </div>

<script>
(function(){
  "use strict";

  var CAT_C = { narrowbody:'#2f6df0', widebody:'#7a4ceb', regional:'#0e9488', turboprop:'#12a150', supersonic:'#dc2626' };
  var CAT_L = { narrowbody:'협동체', widebody:'광동체', regional:'리저널', turboprop:'터보프롭', supersonic:'초음속기' };
  var CAT_O = ['narrowbody','widebody','regional','turboprop','supersonic'];
  var CABIN = { economy:'이코노미', premium_economy:'프리미엄 이코노미', business:'비즈니스', first:'퍼스트' };
  var PAL = ['#2f6df0','#4f46e5','#7a4ceb','#9333ea','#be123c','#db2777',
             '#dc2626','#ea580c','#b45309','#12a150','#0e9488','#0891b2'];

  var air = [], ac = [], ap = [], mine = { flights:[], hiddenAirlines:[], customAirlines:[] };
  var apBy = {}, acBy = {}, fAir = {}, fAc = {}, visits = {};
  var S = { sort:'alpha', filter:'all', q:'', acFilter:'all', acQ:'' };

  function e(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function hash(s,n){ var h=0; s=s||'X';
    for(var i=0;i<s.length;i++) h=(s.charCodeAt(i)+((h<<5)-h))|0; return Math.abs(h)%n; }
  function pal(s){ return PAL[hash(s,PAL.length)]; }

  window.__tf = function(img, color, txt){
    var d = document.createElement('div');
    d.className = 'mg'; d.style.background = color; d.textContent = txt;
    img.replaceWith(d);
  };
  function tile(o, big){
    // one shape for every airline: a square brand tile, or a colour+code
    // monogram for the handful with no artwork anywhere
    var cls = 'tile' + (big ? ' big' : '');
    var code = (o.iata || o.name.slice(0,2)).toUpperCase(), col = pal(o.iata || o.name);
    if (o.sq) {
      return '<div class="' + cls + '"><img src="logos/sq/' + encodeURIComponent(o.iata) + '.png" alt="" ' +
             'loading="lazy" decoding="async" onerror="__tf(this,\'' + col + '\',\'' + e(code) + '\')"></div>';
    }
    return '<div class="' + cls + '"><div class="mg" style="background:' + col + '">' + e(code) + '</div></div>';
  }
  function acTile(x, big){
    var c = CAT_C[x.category] || '#64748b';
    return '<div class="tile' + (big?' big':'') + '"><div class="mg" style="background:' + c + '">' + e(x.code) + '</div></div>';
  }
  function acName(c){ var x = acBy[c]; return x ? x.name : c; }

  function load(){
    return Promise.all(['data/airlines.json','data/aircraft.json','data/airports.json','data/my-flights.json']
      .map(function(u){ return fetch(u).then(function(r){ return r.json(); }); })
    ).then(function(r){
      ac = r[1]; ap = r[2]; mine = r[3] || mine;
      ap.forEach(function(a){ apBy[a.iata] = a; });
      ac.forEach(function(a){ acBy[a.code] = a; });
      var hid = {}; (mine.hiddenAirlines||[]).forEach(function(i){ hid[i] = 1; });
      air = r[0].filter(function(a){ return !hid[a.id]; });
      (mine.customAirlines||[]).forEach(function(c){
        air.push({ id:c.id, name:c.name, iata:c.iata||'', country:c.country||'', flag:c.flag||'🏳️',
                   destinations:0, passengersMillions:null, alliance:'', flagCarrier:false, sq:false, icao:'' });
      });
      (mine.flights||[]).forEach(function(f){
        if (f.airline) (fAir[f.airline] = fAir[f.airline]||[]).push(f);
        if (f.aircraft) (fAc[f.aircraft] = fAc[f.aircraft]||[]).push(f);
        [f.from, f.to].forEach(function(c){
          if (!c) return;
          visits[c] = visits[c] || { n:0, f:[] }; visits[c].n++; visits[c].f.push(f);
        });
      });
    });
  }

  function cell(o, n, art){
    return '<button class="cell' + (n?'':' off') + '" data-t="' + o._t + '" data-id="' + e(o._id) + '">' +
      art + (n ? '<span class="cnt n">' + n + '</span>' : '') +
      '<span class="name">' + e(o._n) + '</span></button>';
  }
  function airCell(a){
    a._t='air'; a._id=a.id; a._n=a.name;
    return cell(a, (fAir[a.id]||[]).length, tile(a));
  }
  function acCell(x){
    x._t='ac'; x._id=x.code; x._n=x.name;
    return cell(x, (fAc[x.code]||[]).length, acTile(x));
  }
  function head(flag, name, done, all){
    return '<div class="grp-h">' + (flag?'<span class="f">'+flag+'</span>':'') +
      '<span class="t">' + e(name) + '</span><span class="c">' + done + ' / ' + all + '</span></div>';
  }

  function renderAir(){
    var box = document.getElementById('g-air'), q = S.q.trim().toLowerCase();
    var L = air.filter(function(a){
      if (q && (a.name+' '+a.country+' '+(a.iata||'')).toLowerCase().indexOf(q) < 0) return false;
      var f = (fAir[a.id]||[]).length > 0;
      return !(S.filter==='flown' && !f) && !(S.filter==='not' && f);
    });
    box.className = S.sort==='country' ? '' : 'grid';
    if (!L.length){ box.className=''; box.innerHTML='<div class="none"><span>🔍</span><p>결과가 없어요.</p></div>'; return; }
    if (S.sort==='country'){
      var g = {}; L.forEach(function(a){ (g[a.country]=g[a.country]||[]).push(a); });
      box.innerHTML = Object.keys(g).sort().map(function(c){
        var it = g[c].sort(function(x,y){ return x.name.localeCompare(y.name); });
        var d = it.filter(function(a){ return (fAir[a.id]||[]).length; }).length;
        return '<div class="grp">' + head(it[0].flag, c, d, it.length) +
               '<div class="grid">' + it.map(airCell).join('') + '</div></div>';
      }).join('');
    } else {
      L.sort(S.sort==='destinations' ? function(a,b){ return (b.destinations-a.destinations)||a.name.localeCompare(b.name); }
        : S.sort==='passengers' ? function(a,b){
            var x=a.passengersMillions, y=b.passengersMillions;
            if (x==null&&y==null) return a.name.localeCompare(b.name);
            if (x==null) return 1; if (y==null) return -1; return y-x; }
        : function(a,b){ return a.name.localeCompare(b.name); });
      box.innerHTML = L.map(airCell).join('');
    }
    bind(box);
  }

  function renderAc(){
    var box = document.getElementById('g-ac'), q = S.acQ.trim().toLowerCase();
    var L = ac.filter(function(x){
      if (q && (x.name+' '+x.manufacturer+' '+x.code).toLowerCase().indexOf(q) < 0) return false;
      var f = (fAc[x.code]||[]).length > 0;
      return !(S.acFilter==='flown' && !f) && !(S.acFilter==='not' && f);
    });
    if (!L.length){ box.innerHTML='<div class="none"><span>🔍</span><p>결과가 없어요.</p></div>'; return; }
    box.innerHTML = CAT_O.map(function(k){
      var it = L.filter(function(x){ return x.category===k; }).sort(function(a,b){ return a.name.localeCompare(b.name); });
      if (!it.length) return '';
      var d = it.filter(function(x){ return (fAc[x.code]||[]).length; }).length;
      return '<div class="grp">' + head('', CAT_L[k], d, it.length) +
             '<div class="grid">' + it.map(acCell).join('') + '</div></div>';
    }).join('');
    bind(box);
  }

  function renderAp(){
    var box = document.getElementById('g-ap'), codes = Object.keys(visits);
    if (!codes.length){
      box.innerHTML = '<div class="none"><span>✈︎</span><p>아직 방문한 공항이 없어요.<br>' +
        '<code>data/my-flights.json</code>에 기록을 추가하면 여기 모여요.</p></div>';
      return;
    }
    var by = {};
    codes.forEach(function(c){
      var m = apBy[c] || { name:c, city:'', country:'기타' };
      (by[m.country] = by[m.country]||[]).push({ c:c, m:m, n:visits[c].n });
    });
    var tot = function(k){ return by[k].reduce(function(s,x){ return s+x.n; },0); };
    box.innerHTML = Object.keys(by).sort(function(a,b){ return tot(b)-tot(a)||a.localeCompare(b); }).map(function(c){
      var it = by[c].sort(function(a,b){ return b.n-a.n||a.c.localeCompare(b.c); });
      return '<div class="grp"><div class="grp-h"><span class="t">' + e(c) + '</span>' +
        '<span class="c">' + it.length + '개 · ' + tot(c) + '회</span></div><div class="rows">' +
        it.map(function(x){
          return '<button class="row" data-t="ap" data-id="' + e(x.c) + '">' +
            '<span class="code n">' + e(x.c) + '</span><span class="an">' + e(x.m.name) +
            (x.m.city ? ' <i>' + e(x.m.city) + '</i>' : '') + '</span>' +
            '<span class="rc">' + x.n + '회</span></button>';
        }).join('') + '</div></div>';
    }).join('');
    bind(box);
  }

  function renderHero(){
    var f = air.filter(function(a){ return (fAir[a.id]||[]).length; });
    var pct = air.length ? f.length/air.length*100 : 0;
    var cs = {}; f.forEach(function(a){ cs[a.country]=1; });
    var acN = ac.filter(function(x){ return (fAc[x.code]||[]).length; }).length;
    document.getElementById('hero').innerHTML =
      '<div class="hero-num n"><b>' + f.length + '</b><span>/ ' + air.length + '</span></div>' +
      '<div class="track"><i style="width:' + Math.max(pct, f.length?1.5:0) + '%"></i></div>' +
      '<div class="hero-sub"><b>' + (mine.flights||[]).length + '</b> 탑승 · <b>' +
        Object.keys(visits).length + '</b> 공항 · <b>' + acN + '</b>/' + ac.length + ' 기종 · <b>' +
        Object.keys(cs).length + '</b> 국가</div>';
  }

  function flights(list, o){
    o = o || {};
    return '<ul class="fl">' + list.map(function(f){
      var b = [];
      if (o.al){ var a = air.filter(function(x){ return x.id===f.airline; })[0]; b.push(e(a?a.name:(f.airline||''))); }
      if (f.flightNumber) b.push(e(f.flightNumber));
      if (o.ac && f.aircraft) b.push(e(acName(f.aircraft)));
      if (f.cabinClass) b.push(e(CABIN[f.cabinClass]||f.cabinClass));
      return '<li><div class="d">' + e(f.date||'') + (o.dir ? ' · ' + (f.from===o.dir?'출발':'도착') : '') + '</div>' +
        '<div class="r">' + e(f.from||'?') + '<i>→</i>' + e(f.to||'?') + '</div>' +
        (b.length ? '<div class="m"><span>' + b.join('</span><span>') + '</span></div>' : '') +
        (f.notes ? '<div class="nt">' + e(f.notes) + '</div>' : '') + '</li>';
    }).join('') + '</ul>';
  }
  function desc(a){ return a.slice().sort(function(x,y){ return (y.date||'').localeCompare(x.date||''); }); }
  function nada(m){ return '<div class="none"><span>✈︎</span><p>' + m + '</p></div>'; }

  function sheetAir(id){
    var a = air.filter(function(x){ return x.id===id; })[0];
    if (!a) return nada('찾을 수 없어요.');
    var f = desc(fAir[id]||[]), t = [];
    if (a.iata) t.push(a.iata + (a.icao ? ' · ' + a.icao : ''));
    if (a.alliance) t.push(a.alliance);
    if (a.flagCarrier) t.push('플래그 캐리어');
    if (a.destinations) t.push('취항지 ' + a.destinations);
    if (a.passengersMillions) t.push('연 ' + a.passengersMillions + '백만 명');
    return '<div class="sh-h">' + tile(a, true) + '<div><h2>' + e(a.name) + '</h2>' +
      '<p>' + (a.flag||'') + ' ' + e(a.country) + '</p></div></div>' +
      (t.length ? '<div class="tags"><b>' + t.map(e).join('</b><b>') + '</b></div>' : '') +
      (f.length ? '<div class="lbl">' + f.length + '회 탑승</div>' + flights(f, { ac:1 })
                : nada('아직 탑승 기록이 없어요.'));
  }
  function sheetAc(code){
    var x = acBy[code];
    if (!x) return nada('찾을 수 없어요.');
    var f = desc(fAc[code]||[]);
    return '<div class="sh-h">' + acTile(x, true) + '<div><h2>' + e(x.name) + '</h2>' +
      '<p>' + e(x.manufacturer) + '</p></div></div>' +
      '<div class="tags"><b>' + CAT_L[x.category] + '</b><b>' + e(x.code) + '</b></div>' +
      (f.length ? '<div class="lbl">' + f.length + '회 탑승</div>' + flights(f, { al:1 })
                : nada('아직 이 기종을 탄 기록이 없어요.'));
  }
  function sheetAp(c){
    var m = apBy[c] || { name:c, city:'', country:'' }, v = visits[c] || { f:[] };
    var f = desc(v.f), col = pal(c);
    return '<div class="sh-h"><div class="tile big"><div class="mg" style="background:' + col + '">' + e(c) +
      '</div></div><div><h2>' + e(m.name) + '</h2><p>' + e(m.city||'') +
      (m.city&&m.country?' · ':'') + e(m.country||'') + '</p></div></div>' +
      '<div class="lbl">' + f.length + '회 방문</div>' + flights(f, { al:1, dir:c });
  }

  function open(t, id){
    document.getElementById('sh').innerHTML =
      t==='air' ? sheetAir(id) : t==='ac' ? sheetAc(id) : sheetAp(id);
    document.getElementById('ov').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function close(){
    document.getElementById('ov').classList.remove('open');
    document.body.style.overflow = '';
  }
  function bind(root){
    Array.prototype.forEach.call(root.querySelectorAll('[data-t]'), function(el){
      el.addEventListener('click', function(){ open(el.getAttribute('data-t'), el.getAttribute('data-id')); });
    });
  }
  function seg(sel, key, cb){
    var b = document.querySelectorAll(sel + ' .opt');
    Array.prototype.forEach.call(b, function(x){
      x.addEventListener('click', function(){
        Array.prototype.forEach.call(b, function(y){ y.classList.remove('on'); });
        x.classList.add('on');
        S[key] = x.getAttribute('data-sort') || x.getAttribute('data-filter');
        cb();
      });
    });
  }

  function init(){
    var deb = function(fn){ var t; return function(){ clearTimeout(t); t=setTimeout(fn,120); }; };
    var qa = document.getElementById('q-air');
    qa.addEventListener('input', deb(function(){ S.q = qa.value; renderAir(); }));
    var qc = document.getElementById('q-ac');
    qc.addEventListener('input', deb(function(){ S.acQ = qc.value; renderAc(); }));
    seg('#sort-air','sort',renderAir); seg('#filt-air','filter',renderAir); seg('#filt-ac','acFilter',renderAc);
    var tabs = document.querySelectorAll('.tab');
    Array.prototype.forEach.call(tabs, function(t){
      t.addEventListener('click', function(){
        Array.prototype.forEach.call(tabs, function(y){ y.classList.remove('active'); });
        t.classList.add('active');
        Array.prototype.forEach.call(document.querySelectorAll('.panel'), function(p){ p.classList.remove('active'); });
        document.getElementById('tab-' + t.getAttribute('data-tab')).classList.add('active');
      });
    });
    document.getElementById('x').addEventListener('click', close);
    document.getElementById('ov').addEventListener('click', function(ev){ if (ev.target.id==='ov') close(); });
    document.addEventListener('keydown', function(ev){ if (ev.key==='Escape') close(); });
  }

  load().then(function(){
    renderHero(); renderAir(); renderAc(); renderAp(); init();
  }).catch(function(err){
    document.getElementById('g-air').innerHTML =
      '<div class="none"><span>⚠︎</span><p>데이터를 불러오지 못했어요.<br>로컬에선 <code>python3 -m http.server</code>로 열어주세요.</p></div>';
    console.error(err);
  });
})();
</script>
</body>
</html>
