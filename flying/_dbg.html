<!DOCTYPE html><html><head><style>
.card{position:relative;border:1px solid #ccc;border-radius:16px;padding:15px 8px 11px;
  display:flex;flex-direction:column;align-items:center;gap:9px;width:116px;}
.logo{width:100%;height:38px;display:grid;place-items:center;}
.logo img{width:100%;height:38px;object-fit:contain;display:block;}
.name{font-size:.7rem;height:2.6em;}
</style></head><body>
<div class="card"><div class="logo"><img id="a" src="logos/aer-lingus.svg"></div><div class="name">Aer Lingus</div></div>
<div class="card"><div class="logo"><img id="b" src="logos/korean-air.svg"></div><div class="name">Korean Air</div></div>
<pre id="out">measuring…</pre>
<script>
window.addEventListener('load', function(){
  setTimeout(function(){
    var lines = [];
    ['a','b'].forEach(function(id){
      var img = document.getElementById(id);
      var lw = img.parentElement.getBoundingClientRect();
      var ir = img.getBoundingClientRect();
      var cs = getComputedStyle(img);
      lines.push(id + ': logoBox=' + lw.width.toFixed(1) + 'x' + lw.height.toFixed(1) +
        ' | img=' + ir.width.toFixed(1) + 'x' + ir.height.toFixed(1) +
        ' | computed h=' + cs.height + ' w=' + cs.width +
        ' | natural=' + img.naturalWidth + 'x' + img.naturalHeight);
    });
    document.getElementById('out').textContent = lines.join('\n');
    document.title = 'DONE';
  }, 700);
});
</script></body></html>
